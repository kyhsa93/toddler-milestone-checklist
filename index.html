<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Toddler Development Notebook</title>
<meta name="description" content="12~36개월 영유아 발달 지연 관찰 체크리스트와 성장 백분위 기록 (진단 도구 아님)" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#5c7a64" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="발달수첩" />
<style>
  :root {
    --paper: #f1f4ee;
    --paper-raised: #ffffff;
    --ink: #263029;
    --ink-soft: #5b6a5f;
    --ink-faint: #8b988e;
    --sage: #5c7a64;
    --sage-deep: #3f5b47;
    --sage-pale: #e2ebe1;
    --amber: #c97c2c;
    --amber-pale: #f7e9d6;
    --critical: #b3261e;
    --critical-pale: #fbe4e2;
    --line: #d7ded2;
    --shadow: 0 1px 2px rgba(38, 48, 41, 0.06), 0 4px 14px rgba(38, 48, 41, 0.05);
    --font-display: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --font-body: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Roboto Mono", "Noto Sans Mono CJK KR", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #182119;
      --paper-raised: #202b22;
      --ink: #e9efe6;
      --ink-soft: #adbdae;
      --ink-faint: #71847a;
      --sage: #8fb49b;
      --sage-deep: #b7d4c1;
      --sage-pale: #26362b;
      --amber: #e2a15c;
      --amber-pale: #3a2e1c;
      --critical: #ff6b5e;
      --critical-pale: #4a2420;
      --line: #33402f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.25);
    }
  }
  :root[data-theme="dark"] {
    --paper: #182119;
    --paper-raised: #202b22;
    --ink: #e9efe6;
    --ink-soft: #adbdae;
    --ink-faint: #71847a;
    --sage: #8fb49b;
    --sage-deep: #b7d4c1;
    --sage-pale: #26362b;
    --amber: #e2a15c;
    --amber-pale: #3a2e1c;
    --critical: #ff6b5e;
    --critical-pale: #4a2420;
    --line: #33402f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.25);
  }
  :root[data-theme="light"] {
    --paper: #f1f4ee;
    --paper-raised: #ffffff;
    --ink: #263029;
    --ink-soft: #5b6a5f;
    --ink-faint: #8b988e;
    --sage: #5c7a64;
    --sage-deep: #3f5b47;
    --sage-pale: #e2ebe1;
    --amber: #c97c2c;
    --amber-pale: #f7e9d6;
    --critical: #b3261e;
    --critical-pale: #fbe4e2;
    --line: #d7ded2;
    --shadow: 0 1px 2px rgba(38, 48, 41, 0.06), 0 4px 14px rgba(38, 48, 41, 0.05);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* Masthead */
  .masthead { padding: 6px 2px 22px; border-bottom: 1px solid var(--line); }
  .masthead-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--sage-deep);
    background: var(--sage-pale);
    border: 1px solid var(--line);
    padding: 4px 10px;
    border-radius: 3px;
  }
  .lang-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper-raised);
    color: var(--ink);
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .lang-toggle:hover { border-color: var(--sage); }
  .lang-toggle:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(26px, 6vw, 32px);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 14px 0 6px;
    text-wrap: balance;
  }
  .sub { color: var(--ink-soft); font-size: 15px; max-width: 46ch; }
  .age-chip {
    display: inline-block;
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink);
    border: 1px solid var(--line);
    background: var(--paper-raised);
    padding: 5px 10px;
    border-radius: 3px;
  }

  /* Disclaimer stamp */
  .stamp {
    margin-top: 22px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    border-radius: 4px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .stamp-title {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--amber);
    margin-bottom: 8px;
  }
  .stamp ul { margin: 0; padding-left: 18px; }
  .stamp li { font-size: 14px; color: var(--ink-soft); margin-bottom: 5px; }
  .stamp li:last-child { margin-bottom: 0; }
  .stamp strong { color: var(--ink); font-weight: 600; }

  /* Sensory reference note */
  .sensory-note {
    margin-top: 14px;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 18px;
    background: var(--sage-pale);
  }
  .sensory-note-title {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--sage-deep);
    margin-bottom: 6px;
  }
  .sensory-note p { font-size: 13.5px; color: var(--ink-soft); margin: 0; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    margin-top: 24px;
    border-bottom: 1px solid var(--line);
  }
  .tab-btn {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 4px;
    margin-right: 18px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--ink-faint);
    cursor: pointer;
  }
  .tab-btn.active { color: var(--sage-deep); border-bottom-color: var(--sage); }
  .tab-btn:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Age setting */
  .age-setting {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 16px;
  }
  .age-setting label { font-size: 13.5px; color: var(--ink); flex-shrink: 0; }
  .age-setting input, .age-setting select {
    font-family: var(--font-body);
    font-size: 14px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
  }
  .age-setting input:focus-visible, .age-setting select:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .age-setting-hint { font-size: 12px; color: var(--ink-faint); flex-basis: 100%; }
  .age-setting-hint.current-age { color: var(--sage-deep); font-weight: 600; }

  /* Sticky progress */
  .progress-bar {
    position: sticky;
    top: 0;
    z-index: 5;
    margin-top: 18px;
    background: var(--paper);
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .progress-track {
    flex: 1;
    height: 5px;
    background: var(--sage-pale);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--sage);
    transition: width 0.25s ease;
  }
  .progress-nums { white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* Age band section */
  .band {
    margin-top: 30px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .band-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--sage-pale);
  }
  .band-month {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 600;
    color: var(--sage-deep);
    font-variant-numeric: tabular-nums;
  }
  .band-label { font-size: 14px; color: var(--ink-soft); }
  .band-tally {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .band.locked { opacity: 0.6; }
  .band.locked .band-head { background: var(--paper); }
  .band-locked-note {
    padding: 14px 18px;
    font-size: 13px;
    color: var(--ink-faint);
    font-style: italic;
  }

  /* Regression check */
  .regression-check {
    margin-top: 30px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    border-radius: 4px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .regression-check-title {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--amber);
    margin-bottom: 8px;
  }
  .regression-check p { font-size: 14px; color: var(--ink-soft); margin: 0 0 12px; }
  .regression-toggle { display: flex; gap: 8px; flex-wrap: wrap; }
  .regression-toggle button {
    font-family: var(--font-body);
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .regression-toggle button:hover { border-color: var(--sage); }
  .regression-toggle button:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .regression-toggle button.active-safe { background: var(--sage); border-color: var(--sage); color: #fff; }
  .regression-toggle button.active-concern { background: var(--amber); border-color: var(--amber); color: #fff; }

  /* Symptom check */
  .symptom-disclaimer {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-left: 3px solid var(--critical);
    border-radius: 4px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .symptom-disclaimer-title {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--critical);
    margin-bottom: 8px;
  }
  .symptom-disclaimer p { font-size: 14px; color: var(--ink-soft); margin: 0 0 8px; }
  .symptom-disclaimer p:last-child { margin-bottom: 0; }

  .symptom-card {
    margin-top: 24px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .symptom-card-head {
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--sage-pale);
    font-size: 15px;
    font-weight: 700;
  }
  .symptom-card-body { padding: 4px 18px 18px; }

  .symptom-numeric-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    padding-top: 14px;
  }
  .symptom-numeric-field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin-bottom: 4px;
  }
  .symptom-numeric-field input {
    width: 90px;
    font-family: var(--font-body);
    font-size: 14px;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
  }
  .symptom-numeric-field input:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .symptom-age-note { font-size: 12px; color: var(--ink-faint); margin-top: 8px; }

  .symptom-group-title {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    font-weight: 600;
    margin-top: 16px;
    margin-bottom: 6px;
  }
  .symptom-group-title.tier1 { color: var(--critical); }
  .symptom-group-title.tier2 { color: var(--amber); }

  .symptom-check-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 7px 0;
  }
  .symptom-check-row input[type="checkbox"] {
    margin-top: 3px;
    width: 17px;
    height: 17px;
    accent-color: var(--sage);
    flex-shrink: 0;
  }
  .symptom-check-row label { font-size: 14px; color: var(--ink); }

  .symptom-result {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 4px;
    border: 1px solid var(--line);
    font-size: 14px;
  }
  .symptom-result-tier {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    font-weight: 700;
    margin-bottom: 6px;
    display: inline-block;
  }
  .symptom-result-title { font-weight: 700; margin-bottom: 4px; }
  .symptom-result-text { color: var(--ink-soft); }
  .symptom-result.tier1 { background: var(--critical-pale); border-color: var(--critical); }
  .symptom-result.tier1 .symptom-result-tier { color: var(--critical); }
  .symptom-result.tier2 { background: var(--amber-pale); border-color: var(--amber); }
  .symptom-result.tier2 .symptom-result-tier { color: var(--amber); }
  .symptom-result.tier3 { background: var(--paper); border-color: var(--line); }
  .symptom-result.tier3 .symptom-result-tier { color: var(--ink-soft); }
  .symptom-result.tier4 { background: var(--sage-pale); border-color: var(--sage); }
  .symptom-result.tier4 .symptom-result-tier { color: var(--sage-deep); }

  .symptom-footer-note { font-size: 12px; color: var(--ink-faint); margin-top: 24px; }

  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: none; }
  .item-body { flex: 1; min-width: 0; }
  .item-domain {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.03em;
    color: var(--ink-faint);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 6px;
    margin-bottom: 5px;
  }
  .item-text { font-size: 14.5px; }
  .toggle { display: flex; gap: 6px; flex-shrink: 0; }
  .toggle button {
    font-family: var(--font-body);
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .toggle button:hover { border-color: var(--sage); }
  .toggle button:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .toggle button.active-yes { background: var(--sage); border-color: var(--sage); color: #fff; }
  .toggle button.active-notyet { background: var(--amber); border-color: var(--amber); color: #fff; }

  /* Result stamp */
  .result {
    margin-top: 34px;
    padding: 24px 22px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper-raised);
    box-shadow: var(--shadow);
    text-align: center;
  }
  .result-badge {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid var(--sage);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
    color: var(--sage-deep);
    font-variant-numeric: tabular-nums;
  }
  .result-badge.flag { border-color: var(--amber); color: var(--amber); }
  .result-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .result-text { font-size: 14px; color: var(--ink-soft); max-width: 44ch; margin: 0 auto 14px; }
  .domain-breakdown-wrap { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 4px; }
  .domain-breakdown-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    text-align: center;
    margin-bottom: 8px;
  }
  .domain-breakdown {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .domain-breakdown b { color: var(--ink-soft); font-weight: 600; }

  /* Growth tab */
  .growth-form {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 8px;
    margin-top: 20px;
    align-items: end;
  }
  .growth-form label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin-bottom: 4px;
  }
  .growth-form input {
    width: 100%;
    font-family: var(--font-body);
    font-size: 14px;
    padding: 8px 9px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper-raised);
    color: var(--ink);
  }
  .growth-form input:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .growth-form button {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 4px;
    border: 1px solid var(--sage);
    background: var(--sage);
    color: #fff;
    cursor: pointer;
  }
  @media (max-width: 480px) {
    .growth-form { grid-template-columns: 1fr 1fr; }
    .growth-form button { grid-column: span 2; }
  }

  .chart-card {
    margin-top: 24px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 16px 18px;
  }
  .chart-title {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .chart-card canvas { width: 100%; height: 140px; display: block; }
  .chart-empty { font-size: 13px; color: var(--ink-faint); padding: 30px 0; text-align: center; }

  .growth-table {
    margin-top: 24px;
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  .growth-table th, .growth-table td {
    text-align: left;
    padding: 9px 8px;
    border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .growth-table th {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    font-weight: 500;
    letter-spacing: 0.03em;
  }
  .growth-table td.del {
    text-align: right;
  }
  .growth-table td.del button {
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--ink-faint);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }
  .growth-table td.del button:hover { color: var(--amber); }
  .growth-empty { font-size: 13px; color: var(--ink-faint); margin-top: 18px; }

  footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  footer p { font-size: 12px; color: var(--ink-faint); max-width: 34ch; margin: 0; }
  .footer-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .footer-share-status {
    flex-basis: 100%;
    font-size: 12px;
    color: var(--sage-deep);
    margin: 0;
  }
  .share-app-btn {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;

  function t() {
    return STRINGS[locale];
  }

  const APP_URL = "https://kyhsa93.github.io/toddler-milestone-checklist/";

  const CHILD_BIRTHDATE_KEY = "dev-child-birthdate";
  const CHILD_SEX_KEY = "dev-child-sex";
  const LEGACY_CHILD_AGE_KEY = "dev-child-age-months";
  const DAYS_PER_MONTH = 30.4375;

  let childBirthdate = localStorage.getItem(CHILD_BIRTHDATE_KEY);
  let childSex = localStorage.getItem(CHILD_SEX_KEY);
  if (childSex !== "boy" && childSex !== "girl") childSex = null;

  // One-time migration from the old "current age in months" input to a
  // birthdate, so age keeps computing correctly instead of going stale.
  if (!childBirthdate) {
    const legacy = localStorage.getItem(LEGACY_CHILD_AGE_KEY);
    const legacyMonths = legacy === null ? NaN : parseInt(legacy, 10);
    if (Number.isFinite(legacyMonths) && legacyMonths >= 0) {
      const approx = new Date(Date.now() - legacyMonths * DAYS_PER_MONTH * 86400000);
      childBirthdate = approx.toISOString().slice(0, 10);
      localStorage.setItem(CHILD_BIRTHDATE_KEY, childBirthdate);
    }
  }
  localStorage.removeItem(LEGACY_CHILD_AGE_KEY);

  function ageMonthsFloatAt(dateStr) {
    if (!childBirthdate) return null;
    const birth = new Date(childBirthdate + "T00:00:00").getTime();
    const at = new Date(dateStr + "T00:00:00").getTime();
    if (!Number.isFinite(birth) || !Number.isFinite(at) || at < birth) return null;
    return (at - birth) / 86400000 / DAYS_PER_MONTH;
  }

  function currentAgeMonthsFloat() {
    if (!childBirthdate) return null;
    return ageMonthsFloatAt(new Date().toISOString().slice(0, 10));
  }

  function currentAgeMonthsInt() {
    const f = currentAgeMonthsFloat();
    return f === null ? null : Math.floor(f);
  }

  function isBandLocked(band) {
    const age = currentAgeMonthsInt();
    return age !== null && band.month > age;
  }

  function updateCurrentAgeDisplay() {
    const el = document.getElementById("txt-current-age-display");
    const age = currentAgeMonthsInt();
    if (age === null) {
      el.textContent = "";
      el.classList.remove("current-age");
    } else {
      el.textContent = t().currentAgeDisplay(age);
      el.classList.add("current-age");
    }
  }

  const REGRESSION_KEY = "dev-regression-flag";
  function getInitialRegressionFlag() {
    const saved = localStorage.getItem(REGRESSION_KEY);
    return saved === "yes" || saved === "no" ? saved : null;
  }
  let regressionFlag = getInitialRegressionFlag();

  function renderRegression() {
    const s = t();
    const noBtn = document.getElementById("regression-no");
    const yesBtn = document.getElementById("regression-yes");
    noBtn.classList.toggle("active-safe", regressionFlag === "no");
    yesBtn.classList.toggle("active-concern", regressionFlag === "yes");
    noBtn.setAttribute("aria-pressed", regressionFlag === "no" ? "true" : "false");
    yesBtn.setAttribute("aria-pressed", regressionFlag === "yes" ? "true" : "false");
    document.getElementById("regression-print-state").textContent =
      regressionFlag === "no" ? " — " + s.regressionNo : regressionFlag === "yes" ? " — " + s.regressionYes : "";
  }

  function setRegressionFlag(value) {
    regressionFlag = regressionFlag === value ? null : value;
    if (regressionFlag === null) localStorage.removeItem(REGRESSION_KEY);
    else localStorage.setItem(REGRESSION_KEY, regressionFlag);
    renderRegression();
    updateResult();
  }

    document.getElementById("txt-sex-label").textContent = s.sexLabel;
    document.getElementById("txt-sex-boy-option").textContent = s.sexBoyOption;
    document.getElementById("txt-sex-girl-option").textContent = s.sexGirlOption;

    document.getElementById("txt-regression-title").textContent = s.regressionTitle;
    document.getElementById("txt-regression-text").textContent = s.regressionText;
    document.getElementById("regression-no").textContent = s.regressionNo;
    document.getElementById("regression-yes").textContent = s.regressionYes;
    document.getElementById("txt-breakdown-label").textContent = s.breakdownLabel;
  }

  const STORAGE_KEY = "dev-checklist-responses-v3";
  let responses = {};
  try {
    responses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) {
    responses = {};
  }

  const bandsEl = document.getElementById("bands");

  function itemKey(month, idx) {
    return month + "-" + idx;
  }

  function render() {
    const s = t();
    bandsEl.innerHTML = "";
    DATA.forEach((band) => {
      const locked = isBandLocked(band);
      const section = document.createElement("section");
      section.className = "band" + (locked ? " locked" : "");

      const head = document.createElement("div");
      head.className = "band-head";
      const notYetCount = band.items.filter(
        (_, i) => responses[itemKey(band.month, i)] === "notyet"
      ).length;
      head.innerHTML =
        '<span class="band-month">' + band.month + "M</span>" +
        '<span class="band-label">' + band.label[locale] + "</span>" +
        '<span class="band-tally">' + (locked ? "🔒" : s.bandTally(notYetCount)) + "</span>";
      section.appendChild(head);

      if (locked) {
        const note = document.createElement("div");
        note.className = "band-locked-note";
        note.textContent = s.bandLockedNote(currentAgeMonthsInt());
        section.appendChild(note);
        bandsEl.appendChild(section);
        return;
      }

      band.items.forEach((item, idx) => {
        const key = itemKey(band.month, idx);
        const state = responses[key];

        const row = document.createElement("div");
        row.className = "item";

        const body = document.createElement("div");
        body.className = "item-body";
        const domainTag = document.createElement("div");
        domainTag.className = "item-domain";
        domainTag.textContent = DOMAIN_LABELS[locale][item.domain];
        const label = document.createElement("div");
        label.className = "item-text";
        label.textContent = item[locale];
        const printState = document.createElement("span");
        printState.className = "item-print-state";
        printState.textContent = state === "yes" ? " — " + s.printStateYes : state === "notyet" ? " — " + s.printStateNotYet : "";
        label.appendChild(printState);
        body.appendChild(domainTag);
        body.appendChild(label);
        row.appendChild(body);

        const toggle = document.createElement("div");
        toggle.className = "toggle";

        const yesBtn = document.createElement("button");
        yesBtn.type = "button";
        yesBtn.textContent = s.yesBtn;
        yesBtn.setAttribute("aria-pressed", state === "yes" ? "true" : "false");
        if (state === "yes") yesBtn.classList.add("active-yes");
        yesBtn.addEventListener("click", () => setResponse(key, state === "yes" ? null : "yes"));

        const notYetBtn = document.createElement("button");
        notYetBtn.type = "button";
        notYetBtn.textContent = s.notYetBtn;
        notYetBtn.setAttribute("aria-pressed", state === "notyet" ? "true" : "false");
        if (state === "notyet") notYetBtn.classList.add("active-notyet");
        notYetBtn.addEventListener("click", () => setResponse(key, state === "notyet" ? null : "notyet"));

        toggle.appendChild(yesBtn);
        toggle.appendChild(notYetBtn);
        row.appendChild(toggle);
        section.appendChild(row);
      });

      bandsEl.appendChild(section);
    });

    updateProgress();
    updateResult();
  }

  function setResponse(key, value) {
    if (value === null) {
      delete responses[key];
    } else {
      responses[key] = value;
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(responses));
    render();
  }

  function totalItems() {
    return DATA.reduce((sum, b) => sum + (isBandLocked(b) ? 0 : b.items.length), 0);
  }

  function itemsByDomain() {
    const map = { social: [], language: [], cognitive: [], physical: [] };
    DATA.forEach((band) => {
      if (isBandLocked(band)) return;
      band.items.forEach((item, idx) => {
        map[item.domain].push(itemKey(band.month, idx));
      });
    });
    return map;
  }

  function unlockedKeySet() {
    const set = new Set();
    DATA.forEach((band) => {
      if (isBandLocked(band)) return;
      band.items.forEach((_, idx) => set.add(itemKey(band.month, idx)));
    });
    return set;
  }

  function updateProgress() {
    const unlocked = unlockedKeySet();
    const answered = Object.keys(responses).filter((k) => unlocked.has(k)).length;
    const total = totalItems();
    document.getElementById("progress-nums").textContent = answered + " / " + total;
    document.getElementById("progress-fill").style.width = (total ? (answered / total) * 100 : 0) + "%";
  }

  function updateResult() {
    const s = t();
    const unlocked = unlockedKeySet();
    const relevantEntries = Object.entries(responses).filter(([k]) => unlocked.has(k));
    const answered = relevantEntries.length;
    const notYet = relevantEntries.filter(([, v]) => v === "notyet").length;
    const badge = document.getElementById("result-badge");
    const title = document.getElementById("result-title");
    const text = document.getElementById("result-text");
    const breakdown = document.getElementById("domain-breakdown");
    const breakdownWrap = document.getElementById("domain-breakdown-wrap");

    if (answered === 0 && regressionFlag !== "yes") {
      badge.textContent = "–";
      badge.classList.remove("flag");
      title.textContent = s.resultEmptyTitle;
      text.textContent = s.resultEmptyText;
      breakdownWrap.style.display = "none";
      return;
    }

    if (regressionFlag === "yes") {
      badge.textContent = "!";
      badge.classList.add("flag");
      title.textContent = s.regressionResultTitle;
      text.textContent = s.regressionResultText;
      breakdownWrap.style.display = "none";
      return;
    }

    badge.textContent = notYet;

    const domainMap = itemsByDomain();
    const domainCounts = {};
    let worstDomain = null;
    let worstCount = 0;
    Object.keys(domainMap).forEach((d) => {
      const count = domainMap[d].filter((k) => responses[k] === "notyet").length;
      domainCounts[d] = count;
      if (count > worstCount) {
        worstCount = count;
        worstDomain = d;
      }
    });

    breakdownWrap.style.display = "block";
    breakdown.innerHTML = Object.keys(domainCounts)
      .map((d) => "<span>" + DOMAIN_LABELS[locale][d] + " <b>" + domainCounts[d] + "</b></span>")
      .join("");

    if (notYet === 0) {
      badge.classList.remove("flag");
      title.textContent = s.resultNoneTitle;
      text.textContent = s.resultNoneText;
    } else if (notYet <= 3) {
      badge.classList.add("flag");
      title.textContent = s.resultFewTitle;
      text.textContent = s.resultFewText;
    } else {
      badge.classList.add("flag");
      title.textContent = s.resultManyTitle;
      text.textContent = s.resultManyText;
    }

    if (worstDomain && worstCount >= 3) {
      text.textContent += s.worstDomainNote(DOMAIN_LABELS[locale][worstDomain]);
    }
  }

  document.getElementById("regression-no").addEventListener("click", () => setRegressionFlag("no"));
  document.getElementById("regression-yes").addEventListener("click", () => setRegressionFlag("yes"));

  const birthdateInput = document.getElementById("child-birthdate-input");

  birthdateInput.addEventListener("change", () => {

    childBirthdate = raw || null;

    render();
    renderGrowth();
    renderSymptomCards();

  sexInput.addEventListener("change", () => {
    const raw = sexInput.value;
    childSex = raw === "boy" || raw === "girl" ? raw : null;
    if (childSex) localStorage.setItem(CHILD_SEX_KEY, childSex);
    else localStorage.removeItem(CHILD_SEX_KEY);
    renderGrowth();

  // Shares the app's name/description/URL by default — reads `responses`/
  // `regressionFlag` ONLY to ask the user whether to append the result, and
  // only appends it if they explicitly say yes. Never reads `growthEntries`,
  // `childBirthdate`, or `childSex`, so growth/personal data can never leak in.
  document.getElementById("share-app-btn").addEventListener("click", async () => {
    const s = t();
    const statusEl = document.getElementById("app-share-status");
    statusEl.textContent = "";

    const resultSummary = composeResultSummaryText();
    const includeResult = resultSummary ? confirm(s.shareIncludeResultConfirm) : false;

    const lines = [s.shareAppTitle, s.shareAppText, APP_URL];
    if (includeResult) {
      lines.push("");
      lines.push(resultSummary);
    }
    const text = lines.join("\n");

    if (navigator.share) {
      try {
        await navigator.share({ title: s.shareAppTitle, text });
        return;
      } catch (e) {
        // fall through to clipboard on cancel/failure
      }
    }
    try {
      await navigator.clipboard.writeText(text);
      statusEl.textContent = includeResult ? s.shareCopiedWithResult : s.shareAppCopied;
    } catch (e) {
      statusEl.textContent = s.shareAppFailed + " " + APP_URL;
    }
  });

  document.getElementById("reset-checklist-btn").addEventListener("click", () => {

  // ---- Print & share ----
  // Returns null when there's nothing to summarize yet (no checked items and
  // no regression flag), so callers can tell "no result" apart from "empty result".
  function composeResultSummaryText() {
    const s = t();
    const unlocked = unlockedKeySet();
    const answeredKeys = Object.keys(responses).filter((k) => unlocked.has(k));
    if (answeredKeys.length === 0 && regressionFlag !== "yes") return null;

    const lines = [s.shareTitle, ""];
    lines.push(document.getElementById("result-title").textContent);
    lines.push(document.getElementById("result-text").textContent);
    lines.push("");
    lines.push(s.shareNotYetLabel + ":");

    const notYetLines = [];
    DATA.forEach((band) => {
      if (isBandLocked(band)) return;
      band.items.forEach((item, idx) => {
        const key = itemKey(band.month, idx);
        if (responses[key] === "notyet") {
          notYetLines.push("- [" + band.label[locale] + " / " + DOMAIN_LABELS[locale][item.domain] + "] " + item[locale]);
        }
      });
    });
    lines.push(notYetLines.length ? notYetLines.join("\n") : s.shareNoneFlagged);

    return lines.join("\n");
  }

  function symptomTierBadge(tier) {
    const s = t();
    return [s.symptomTierBadge1, s.symptomTierBadge2, s.symptomTierBadge3, s.symptomTierBadge4][tier - 1];

  function renderResultBlock(result) {
    const s = t();
    if (!result) {
      return '<div class="symptom-result"><span class="symptom-result-tier">' + s.symptomEmptyResult + "</span></div>";
    }
    return (
      '<div class="symptom-result tier' + result.tier + '">' +

      '<div class="symptom-result-title">' + result.title + "</div>" +

    );

  function computeFeverResult() {
    const s = t();
    const fs = symptomState.fever;
    const temp = parseFloat(fs.temp);
    const days = parseFloat(fs.days);
    const hasTemp = Number.isFinite(temp) && temp > 0;
    const anyDanger = Object.values(fs.danger).some(Boolean);
    const ageMonths = currentAgeMonthsFloat();

    if (!hasTemp && !anyDanger) return null;
    if (anyDanger) return { tier: 1, title: s.symptomTier1Title, text: s.symptomTier1Text };
    if (hasTemp && temp > 40.6) return { tier: 1, title: s.symptomTier1Title, text: s.symptomTier1Text };

    if (ageMonths === null) {
      if (hasTemp && temp >= 38.0) return { tier: 1, title: s.symptomTier1Title, text: s.symptomTier1Text };
    } else if (ageMonths < 3) {
      if (hasTemp && temp >= 38.0) return { tier: 1, title: s.symptomTier1Title, text: s.symptomTier1Text };
    } else if (ageMonths < 6) {
      if (hasTemp && temp >= 38.3) return { tier: 2, title: s.symptomTier2Title, text: s.symptomTier2Text };
    } else {
      if (hasTemp && temp >= 39.4) return { tier: 2, title: s.symptomTier2Title, text: s.symptomTier2Text };
    }

    if (hasTemp && Number.isFinite(days) && days >= 5) {
      return { tier: 3, title: s.symptomFeverTier3Title, text: s.symptomFeverTier3Text };
    }
    if (hasTemp) return { tier: 4, title: s.symptomTier4Title, text: s.symptomFeverTier4Text };
    return null;
  }

  function computeCategoryResult(cat) {
    const s = t();

    const anyTier1 = cat.tier1.some((_, idx) => st.tier1[idx]);
    const anyTier2 = cat.tier2.some((_, idx) => st.tier2[idx]);
    if (anyTier1) return { tier: 1, title: s.symptomTier1Title, text: s.symptomTier1Text };
    if (anyTier2) return { tier: 2, title: s.symptomTier2Title, text: s.symptomTier2Text };
    return { tier: 4, title: s.symptomTier4Title, text: s.symptomTier4Text };
  }

  function renderSymptomCards() {
    const container = document.getElementById("symptom-cards");
    if (!container) return;
    let html = renderFeverCard();
    SYMPTOM_CATEGORIES.forEach((cat) => {
      html += renderCategoryCard(cat);

    container.innerHTML = html;

    const feverTemp = document.getElementById("symptom-fever-temp");
    const feverDays = document.getElementById("symptom-fever-days");
    function updateFeverResultOnly() {

    }
    feverTemp.addEventListener("input", () => {
      symptomState.fever.temp = feverTemp.value;
      updateFeverResultOnly();

    feverDays.addEventListener("input", () => {

    container.querySelectorAll('input[type="checkbox"][data-cat]').forEach((box) => {
      box.addEventListener("change", () => {

        const tier = box.dataset.tier;
        const idx = box.dataset.idx;
        symptomState[cat][tier][idx] = box.checked;
        renderSymptomCards();
      });

    FEVER_DANGER_SIGNS.forEach((_, idx) => {
      const box = document.getElementById("symptom-fever-danger-" + idx);
      box.addEventListener("change", () => {
        symptomState.fever.danger[idx] = box.checked;
        renderSymptomCards();
      });
    });
  }

  // ---- Growth percentile reference data ----
  // LMS (Lambda-Mu-Sigma) parameters, one row per (standard, measure, sex, age in months).
  // "who" = WHO Child Growth Standards (used under 24 months, per CDC's own guidance —
  //   MMWR RR-59/9), sourced from the WHO "expanded tables for national health cards"
  //   (cdn.who.int), one row per whole month 12-23.
  // "cdc" = CDC 2000 growth charts (used from 24 months up), sourced from CDC's own
  //   published percentile data files (via the CDC-DNPAO `cdcanthro` package, which
  //   mirrors cdc.gov/growthcharts/percentile_data_files.htm), at their native
  //   half-month grid, 24.5-36.5.
  // "weight"/"length" (WHO, <24mo) vs "weight"/"stature" (CDC, >=24mo) intentionally use
  // different measurement methods (recumbent length vs standing height), matching how
  // each standard expects the child to be measured at that age.

  const GROWTH_REF = {};
  GROWTH_REF_CSV.trim().split("\n").forEach((line) => {
    const [standard, measure, sex, months, L, M, S] = line.split(",");
    const key = standard + "-" + measure + "-" + sex;
    if (!GROWTH_REF[key]) GROWTH_REF[key] = [];
    GROWTH_REF[key].push({ months: parseFloat(months), L: parseFloat(L), M: parseFloat(M), S: parseFloat(S) });
  });
  Object.values(GROWTH_REF).forEach((rows) => rows.sort((a, b) => a.months - b.months));

  // measureKind: "weight" always; "height" maps to WHO "length" under 24mo, CDC "stature" from 24mo.
  function lookupLMS(ageMonths, measureKind, sex) {
    const standard = ageMonths < 24 ? "who" : "cdc";
    const measure = measureKind === "height" ? (standard === "who" ? "length" : "stature") : "weight";
    const rows = GROWTH_REF[standard + "-" + measure + "-" + sex];
    if (!rows || rows.length === 0) return null;
    if (ageMonths < rows[0].months || ageMonths > rows[rows.length - 1].months) return null;

    let lo = rows[0], hi = rows[rows.length - 1];
    for (let i = 0; i < rows.length - 1; i++) {
      if (ageMonths >= rows[i].months && ageMonths <= rows[i + 1].months) {
        lo = rows[i];
        hi = rows[i + 1];
        break;
      }
    }
    if (lo === hi || hi.months === lo.months) return lo;
    const frac = (ageMonths - lo.months) / (hi.months - lo.months);
    return {
      L: lo.L + (hi.L - lo.L) * frac,
      M: lo.M + (hi.M - lo.M) * frac,
      S: lo.S + (hi.S - lo.S) * frac,
    };
  }

  // Standard normal CDF via the Abramowitz-Stegun erf approximation (~1e-7 accuracy).
  function normalCDF(z) {
    const t = 1 / (1 + 0.2316419 * Math.abs(z));
    const d = 0.3989423 * Math.exp((-z * z) / 2);
    let p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
    if (z > 0) p = 1 - p;
    return p;
  }

  // Returns { z, percentile } or null if out of the supported age range (12-36.5mo)
  // or the reference data for that sex isn't available.
  function calcPercentile(value, ageMonths, measureKind, sex) {
    if (!Number.isFinite(value) || value <= 0 || !sex) return null;
    const lms = lookupLMS(ageMonths, measureKind, sex);
    if (!lms) return null;
    const { L, M, S } = lms;
    const z = Math.abs(L) < 1e-9 ? Math.log(value / M) / S : (Math.pow(value / M, L) - 1) / (L * S);
    return { z, percentile: normalCDF(z) * 100 };
  }

  // ---- Growth log ----
  const GROWTH_KEY = "dev-growth-log-v1";
  let growthEntries = [];
  try {
    growthEntries = JSON.parse(localStorage.getItem(GROWTH_KEY)) || [];
  } catch (e) {
    growthEntries = [];
  }

  function saveGrowth() {
    localStorage.setItem(GROWTH_KEY, JSON.stringify(growthEntries));
  }

  function formatPercentileValue(result) {
    const flag = Math.abs(result.z) > 5 ? " " + t().percentileImplausible : "";
    return Math.round(result.percentile) + "%" + flag;
  }

  function formatPercentileCell(entry) {
    const s = t();
    if (!childBirthdate) return s.percentileNoData;
    if (!childSex) return s.percentileNeedSex;
    const ageAt = ageMonthsFloatAt(entry.date);
    if (ageAt === null) return s.percentileNoData;

    const heightResult = entry.height != null ? calcPercentile(entry.height, ageAt, "height", childSex) : null;
    const weightResult = entry.weight != null ? calcPercentile(entry.weight, ageAt, "weight", childSex) : null;
    const hText = entry.height == null ? s.percentileNoData : heightResult ? formatPercentileValue(heightResult) : s.percentileOutOfRange;
    const wText = entry.weight == null ? s.percentileNoData : weightResult ? formatPercentileValue(weightResult) : s.percentileOutOfRange;
    return s.percentileCell(hText, wText);
  }

  function renderGrowth() {
    const s = t();
    growthEntries.sort((a, b) => a.date.localeCompare(b.date));

    const tbody = document.getElementById("growth-table-body");
    const table = document.getElementById("growth-table");
    const empty = document.getElementById("growth-empty");
    document.getElementById("growth-note2").textContent = s.growthNote2;
    tbody.innerHTML = "";

    if (growthEntries.length === 0) {
      table.style.display = "none";
      empty.style.display = "block";
      empty.textContent = s.growthEmpty;
    } else {
      table.style.display = "table";
      empty.style.display = "none";
      growthEntries.forEach((entry) => {
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + entry.date + "</td>" +
          "<td>" + (entry.height != null ? entry.height : "–") + "</td>" +
          "<td>" + (entry.weight != null ? entry.weight : "–") + "</td>" +
          "<td>" + formatPercentileCell(entry) + "</td>" +
          '<td class="del"><button type="button" data-id="' + entry.id + '" aria-label="' + s.deleteEntryAria(entry.date) + '">' + s.delBtn + "</button></td>";
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll("button[data-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          growthEntries = growthEntries.filter((e) => String(e.id) !== btn.dataset.id);
          saveGrowth();
          renderGrowth();
        });
      });
    }

    drawChart("chart-height", growthEntries.filter((e) => e.height != null).map((e) => ({ date: e.date, value: e.height })));
    drawChart("chart-weight", growthEntries.filter((e) => e.weight != null).map((e) => ({ date: e.date, value: e.weight })));
  }

  function drawChart(canvasId, points) {
    const canvas = document.getElementById(canvasId);
    const emptyEl = document.getElementById(canvasId + "-empty");
    const ctx = canvas.getContext("2d");
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = rect.width || 560;
    const h = 140;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (points.length < 2) {
      canvas.style.display = "none";
      emptyEl.style.display = "block";
      return;
    }
    canvas.style.display = "block";
    emptyEl.style.display = "none";

    const pad = { top: 10, right: 10, bottom: 10, left: 34 };
    const plotW = w - pad.left - pad.right;
    const plotH = h - pad.top - pad.bottom;

    const values = points.map((p) => p.value);
    let min = Math.min(...values);
    let max = Math.max(...values);
    if (min === max) { min -= 1; max += 1; }
    const margin = (max - min) * 0.15;
    min -= margin;
    max += margin;

    const styles = getComputedStyle(document.documentElement);
    const line = styles.getPropertyValue("--line").trim();
    const sage = styles.getPropertyValue("--sage").trim();
    const amber = styles.getPropertyValue("--amber").trim();
    const inkFaint = styles.getPropertyValue("--ink-faint").trim();

    ctx.strokeStyle = line;
    ctx.lineWidth = 1;
    ctx.font = "10px " + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = inkFaint;
    for (let i = 0; i <= 3; i++) {
      const y = pad.top + (plotH / 3) * i;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(w - pad.right, y);
      ctx.stroke();
      const val = max - ((max - min) / 3) * i;
      ctx.fillText(val.toFixed(1), 2, y + 3);
    }

    const xFor = (i) => pad.left + (points.length === 1 ? 0 : (plotW / (points.length - 1)) * i);
    const yFor = (v) => pad.top + plotH - ((v - min) / (max - min)) * plotH;

    ctx.beginPath();
    points.forEach((p, i) => {
      const x = xFor(i);
      const y = yFor(p.value);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.lineTo(xFor(points.length - 1), pad.top + plotH);
    ctx.lineTo(xFor(0), pad.top + plotH);
    ctx.closePath();
    ctx.fillStyle = sage + "22";
    ctx.fill();

    ctx.beginPath();
    points.forEach((p, i) => {
      const x = xFor(i);
      const y = yFor(p.value);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = sage;
    ctx.lineWidth = 2;
    ctx.stroke();

    points.forEach((p, i) => {
      const x = xFor(i);
      const y = yFor(p.value);
      const isLast = i === points.length - 1;
      ctx.beginPath();
      ctx.arc(x, y, isLast ? 4 : 2.5, 0, Math.PI * 2);
      ctx.fillStyle = isLast ? amber : sage;
      ctx.fill();
    });
  }

  document.getElementById("growth-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const date = document.getElementById("g-date").value;
    const heightVal = document.getElementById("g-height").value;
    const weightVal = document.getElementById("g-weight").value;
    if (!date || (!heightVal && !weightVal)) return;

    growthEntries.push({
      id: date + "-" + Math.random().toString(36).slice(2, 8),
      date,
      height: heightVal ? parseFloat(heightVal) : null,
      weight: weightVal ? parseFloat(weightVal) : null,
    });
    saveGrowth();
    e.target.reset();
    renderGrowth();
  });

  document.getElementById("reset-growth-btn").addEventListener("click", () => {
    if (confirm(t().resetGrowthConfirm)) {
      growthEntries = [];
      localStorage.removeItem(GROWTH_KEY);
      renderGrowth();
    }
  });

  applyStaticText();
  render();
  renderRegression();
  renderGrowth();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
