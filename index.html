<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>영유아 발달 관찰 수첩</title>
<meta name="description" content="12~36개월 영유아 발달 관찰 체크리스트와 성장 기록 (진단 도구 아님)" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#5c7a64" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="발달수첩" />
<style>
  :root {
    --paper: #f1f4ee;
    --paper-raised: #ffffff;
    --ink: #263029;
    --ink-soft: #5b6a5f;
    --ink-faint: #8b988e;
    --sage: #5c7a64;
    --sage-deep: #3f5b47;
    --sage-pale: #e2ebe1;
    --amber: #c97c2c;
    --amber-pale: #f7e9d6;
    --line: #d7ded2;
    --shadow: 0 1px 2px rgba(38, 48, 41, 0.06), 0 4px 14px rgba(38, 48, 41, 0.05);
    --font-display: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --font-body: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Roboto Mono", "Noto Sans Mono CJK KR", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #182119;
      --paper-raised: #202b22;
      --ink: #e9efe6;
      --ink-soft: #adbdae;
      --ink-faint: #71847a;
      --sage: #8fb49b;
      --sage-deep: #b7d4c1;
      --sage-pale: #26362b;
      --amber: #e2a15c;
      --amber-pale: #3a2e1c;
      --line: #33402f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.25);
    }
  }
  :root[data-theme="dark"] {
    --paper: #182119;
    --paper-raised: #202b22;
    --ink: #e9efe6;
    --ink-soft: #adbdae;
    --ink-faint: #71847a;
    --sage: #8fb49b;
    --sage-deep: #b7d4c1;
    --sage-pale: #26362b;
    --amber: #e2a15c;
    --amber-pale: #3a2e1c;
    --line: #33402f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.25);
  }
  :root[data-theme="light"] {
    --paper: #f1f4ee;
    --paper-raised: #ffffff;
    --ink: #263029;
    --ink-soft: #5b6a5f;
    --ink-faint: #8b988e;
    --sage: #5c7a64;
    --sage-deep: #3f5b47;
    --sage-pale: #e2ebe1;
    --amber: #c97c2c;
    --amber-pale: #f7e9d6;
    --line: #d7ded2;
    --shadow: 0 1px 2px rgba(38, 48, 41, 0.06), 0 4px 14px rgba(38, 48, 41, 0.05);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* Masthead */
  .masthead { padding: 6px 2px 22px; border-bottom: 1px solid var(--line); }
  .masthead-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--sage-deep);
    background: var(--sage-pale);
    border: 1px solid var(--line);
    padding: 4px 10px;
    border-radius: 3px;
  }
  .lang-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper-raised);
    color: var(--ink);
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .lang-toggle:hover { border-color: var(--sage); }
  .lang-toggle:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(26px, 6vw, 32px);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 14px 0 6px;
    text-wrap: balance;
  }
  .sub { color: var(--ink-soft); font-size: 15px; max-width: 46ch; }
  .age-chip {
    display: inline-block;
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink);
    border: 1px solid var(--line);
    background: var(--paper-raised);
    padding: 5px 10px;
    border-radius: 3px;
  }

  /* Disclaimer stamp */
  .stamp {
    margin-top: 22px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    border-radius: 4px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .stamp-title {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--amber);
    margin-bottom: 8px;
  }
  .stamp ul { margin: 0; padding-left: 18px; }
  .stamp li { font-size: 14px; color: var(--ink-soft); margin-bottom: 5px; }
  .stamp li:last-child { margin-bottom: 0; }
  .stamp strong { color: var(--ink); font-weight: 600; }

  /* Sensory reference note */
  .sensory-note {
    margin-top: 14px;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 18px;
    background: var(--sage-pale);
  }
  .sensory-note-title {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--sage-deep);
    margin-bottom: 6px;
  }
  .sensory-note p { font-size: 13.5px; color: var(--ink-soft); margin: 0; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    margin-top: 24px;
    border-bottom: 1px solid var(--line);
  }
  .tab-btn {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 4px;
    margin-right: 18px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--ink-faint);
    cursor: pointer;
  }
  .tab-btn.active { color: var(--sage-deep); border-bottom-color: var(--sage); }
  .tab-btn:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Age setting */
  .age-setting {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 16px;
  }
  .age-setting label { font-size: 13.5px; color: var(--ink); flex-shrink: 0; }
  .age-setting input {
    width: 72px;
    font-family: var(--font-body);
    font-size: 14px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
  }
  .age-setting input:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .age-setting-hint { font-size: 12px; color: var(--ink-faint); flex-basis: 100%; }

  /* Sticky progress */
  .progress-bar {
    position: sticky;
    top: 0;
    z-index: 5;
    margin-top: 18px;
    background: var(--paper);
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .progress-track {
    flex: 1;
    height: 5px;
    background: var(--sage-pale);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--sage);
    transition: width 0.25s ease;
  }
  .progress-nums { white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* Age band section */
  .band {
    margin-top: 30px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .band-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--sage-pale);
  }
  .band-month {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 600;
    color: var(--sage-deep);
    font-variant-numeric: tabular-nums;
  }
  .band-label { font-size: 14px; color: var(--ink-soft); }
  .band-tally {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .band.locked { opacity: 0.6; }
  .band.locked .band-head { background: var(--paper); }
  .band-locked-note {
    padding: 14px 18px;
    font-size: 13px;
    color: var(--ink-faint);
    font-style: italic;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: none; }
  .item-body { flex: 1; min-width: 0; }
  .item-domain {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.03em;
    color: var(--ink-faint);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 6px;
    margin-bottom: 5px;
  }
  .item-text { font-size: 14.5px; }
  .toggle { display: flex; gap: 6px; flex-shrink: 0; }
  .toggle button {
    font-family: var(--font-body);
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .toggle button:hover { border-color: var(--sage); }
  .toggle button:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .toggle button.active-yes { background: var(--sage); border-color: var(--sage); color: #fff; }
  .toggle button.active-notyet { background: var(--amber); border-color: var(--amber); color: #fff; }

  /* Result stamp */
  .result {
    margin-top: 34px;
    padding: 24px 22px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper-raised);
    box-shadow: var(--shadow);
    text-align: center;
  }
  .result-badge {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid var(--sage);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
    color: var(--sage-deep);
    font-variant-numeric: tabular-nums;
  }
  .result-badge.flag { border-color: var(--amber); color: var(--amber); }
  .result-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .result-text { font-size: 14px; color: var(--ink-soft); max-width: 44ch; margin: 0 auto 14px; }
  .domain-breakdown {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    border-top: 1px solid var(--line);
    padding-top: 14px;
    margin-top: 4px;
  }
  .domain-breakdown b { color: var(--ink-soft); font-weight: 600; }

  /* Growth tab */
  .growth-form {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 8px;
    margin-top: 20px;
    align-items: end;
  }
  .growth-form label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin-bottom: 4px;
  }
  .growth-form input {
    width: 100%;
    font-family: var(--font-body);
    font-size: 14px;
    padding: 8px 9px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper-raised);
    color: var(--ink);
  }
  .growth-form input:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .growth-form button {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 4px;
    border: 1px solid var(--sage);
    background: var(--sage);
    color: #fff;
    cursor: pointer;
  }
  @media (max-width: 480px) {
    .growth-form { grid-template-columns: 1fr 1fr; }
    .growth-form button { grid-column: span 2; }
  }

  .chart-card {
    margin-top: 24px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 16px 18px;
  }
  .chart-title {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .chart-card canvas { width: 100%; height: 140px; display: block; }
  .chart-empty { font-size: 13px; color: var(--ink-faint); padding: 30px 0; text-align: center; }

  .growth-table {
    margin-top: 24px;
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  .growth-table th, .growth-table td {
    text-align: left;
    padding: 9px 8px;
    border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .growth-table th {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    font-weight: 500;
    letter-spacing: 0.03em;
  }
  .growth-table td.del {
    text-align: right;
  }
  .growth-table td.del button {
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--ink-faint);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }
  .growth-table td.del button:hover { color: var(--amber); }
  .growth-empty { font-size: 13px; color: var(--ink-faint); margin-top: 18px; }

  footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  footer p { font-size: 12px; color: var(--ink-faint); max-width: 34ch; margin: 0; }
  .footer-actions { display: flex; gap: 8px; }
  .reset-btn {
    font-family: var(--font-body);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .reset-btn:hover { border-color: var(--amber); color: var(--amber); }
  .reset-btn:focus-visible, .lang-toggle:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }

  .result-actions {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .result-actions button {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 4px;
    border: 1px solid var(--sage);
    background: var(--paper-raised);
    color: var(--sage-deep);
    cursor: pointer;
  }
  .result-actions button:hover { background: var(--sage-pale); }
  .result-actions button:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .share-status {
    font-size: 12px;
    color: var(--sage-deep);
    text-align: center;
    margin-top: 8px;
    min-height: 1em;
  }

  @media (prefers-reduced-motion: reduce) {
    .progress-fill { transition: none; }
  }

  .item-print-state { display: none; font-weight: 600; }

  @media print {
    .lang-toggle, .tabs, .age-setting, .toggle, .growth-form,
    .result-actions, footer, .progress-bar { display: none !important; }
    .tab-panel { display: block !important; }
    .item-print-state { display: inline; }
    body { background: #fff; color: #000; }
    .band, .result, .chart-card, .stamp, .sensory-note { box-shadow: none; break-inside: avoid; }
  }
</style>

<div class="wrap">
  <header class="masthead">
    <div class="masthead-top">
      <span class="eyebrow" id="txt-eyebrow"></span>
      <button class="lang-toggle" id="lang-toggle" type="button">
        <span aria-hidden="true">🌐</span><span id="lang-toggle-label"></span>
      </button>
    </div>
    <h1 id="txt-title"></h1>
    <p class="sub" id="txt-sub"></p>
    <span class="age-chip" id="txt-agechip"></span>
  </header>

  <div class="stamp">
    <div class="stamp-title" id="txt-disclaimer-title"></div>
    <ul>
      <li id="txt-disclaimer-1"></li>
      <li id="txt-disclaimer-2"></li>
      <li id="txt-disclaimer-3"></li>
      <li id="txt-disclaimer-4"></li>
    </ul>
  </div>

  <div class="sensory-note">
    <div class="sensory-note-title" id="txt-sensory-title"></div>
    <p id="txt-sensory-text"></p>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab-btn active" type="button" role="tab" aria-selected="true" aria-controls="panel-checklist" id="tab-checklist" data-tab="checklist"><span id="txt-tab-checklist"></span></button>
    <button class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="panel-growth" id="tab-growth" data-tab="growth"><span id="txt-tab-growth"></span></button>
  </div>

  <section class="tab-panel active" id="panel-checklist" role="tabpanel" aria-labelledby="tab-checklist" tabindex="0">
    <div class="age-setting">
      <label for="child-age-input" id="txt-age-setting-label"></label>
      <input type="number" id="child-age-input" min="0" max="60" inputmode="numeric" />
      <span class="age-setting-hint" id="txt-age-setting-hint"></span>
    </div>

    <div class="progress-bar">
      <div class="progress-row">
        <span id="txt-progress-label"></span>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="progress-nums" id="progress-nums">0 / 0</span>
      </div>
    </div>

    <main id="bands"></main>

    <section class="result" id="result">
      <div class="result-badge" id="result-badge">–</div>
      <div class="result-title" id="result-title"></div>
      <div class="result-text" id="result-text"></div>
      <div class="domain-breakdown" id="domain-breakdown"></div>
      <div class="result-actions">
        <button type="button" id="print-btn"></button>
        <button type="button" id="share-btn"></button>
      </div>
      <div class="share-status" id="share-status"></div>
    </section>
  </section>

  <section class="tab-panel" id="panel-growth" role="tabpanel" aria-labelledby="tab-growth" tabindex="0">
    <form class="growth-form" id="growth-form">
      <div>
        <label for="g-date" id="txt-g-date-label"></label>
        <input type="date" id="g-date" required />
      </div>
      <div>
        <label for="g-height" id="txt-g-height-label"></label>
        <input type="number" id="g-height" step="0.1" min="0" max="150" />
      </div>
      <div>
        <label for="g-weight" id="txt-g-weight-label"></label>
        <input type="number" id="g-weight" step="0.1" min="0" max="40" />
      </div>
      <button type="submit" id="txt-g-add-btn"></button>
    </form>

    <div class="chart-card">
      <div class="chart-title" id="txt-chart-height-title"></div>
      <canvas id="chart-height"></canvas>
      <div class="chart-empty" id="chart-height-empty" style="display:none;"></div>
    </div>
    <div class="chart-card">
      <div class="chart-title" id="txt-chart-weight-title"></div>
      <canvas id="chart-weight"></canvas>
      <div class="chart-empty" id="chart-weight-empty" style="display:none;"></div>
    </div>

    <table class="growth-table" id="growth-table" style="display:none;">
      <thead>
        <tr><th id="txt-gth-1"></th><th id="txt-gth-2"></th><th id="txt-gth-3"></th><th></th></tr>
      </thead>
      <tbody id="growth-table-body"></tbody>
    </table>
    <p class="growth-empty" id="growth-empty"></p>
    <p class="growth-empty" id="growth-note2"></p>
  </section>

  <footer>
    <p id="txt-footer-note"></p>
    <div class="footer-actions">
      <button class="reset-btn" id="reset-checklist-btn" type="button"></button>
      <button class="reset-btn" id="reset-growth-btn" type="button"></button>
    </div>
  </footer>
</div>

<script>
  // ---- i18n ----

      head.className = "band-head";

        (_, i) => responses[itemKey(band.month, i)] === "notyet"
      ).length;
      head.innerHTML =
        '<span class="band-month">' + band.month + "M</span>" +

        body.className = "item-body";
        const domainTag = document.createElement("div");
        domainTag.className = "item-domain";
        domainTag.textContent = DOMAIN_LABELS[locale][item.domain];
        const label = document.createElement("div");
        label.className = "item-text";
        label.textContent = item[locale];
        const printState = document.createElement("span");
        printState.className = "item-print-state";
        printState.textContent = state === "yes" ? " — " + s.printStateYes : state === "notyet" ? " — " + s.printStateNotYet : "";
        label.appendChild(printState);
        body.appendChild(domainTag);
        body.appendChild(label);
        row.appendChild(body);

        const toggle = document.createElement("div");
        toggle.className = "toggle";

        const yesBtn = document.createElement("button");
        yesBtn.type = "button";
        yesBtn.textContent = s.yesBtn;
        yesBtn.setAttribute("aria-pressed", state === "yes" ? "true" : "false");
        if (state === "yes") yesBtn.classList.add("active-yes");
        yesBtn.addEventListener("click", () => setResponse(key, state === "yes" ? null : "yes"));

        const notYetBtn = document.createElement("button");
        notYetBtn.type = "button";
        notYetBtn.textContent = s.notYetBtn;
        notYetBtn.setAttribute("aria-pressed", state === "notyet" ? "true" : "false");
        if (state === "notyet") notYetBtn.classList.add("active-notyet");
        notYetBtn.addEventListener("click", () => setResponse(key, state === "notyet" ? null : "notyet"));

        toggle.appendChild(yesBtn);
        toggle.appendChild(notYetBtn);
        row.appendChild(toggle);
        section.appendChild(row);
      });

      bandsEl.appendChild(section);
    });

    updateProgress();
    updateResult();
  }

  function setResponse(key, value) {
    if (value === null) {
      delete responses[key];
    } else {
      responses[key] = value;
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(responses));
    render();
  }

  function totalItems() {
    return DATA.reduce((sum, b) => sum + (isBandLocked(b) ? 0 : b.items.length), 0);
  }

  function itemsByDomain() {
    const map = { social: [], language: [], cognitive: [], physical: [] };
    DATA.forEach((band) => {
      if (isBandLocked(band)) return;
      band.items.forEach((item, idx) => {
        map[item.domain].push(itemKey(band.month, idx));
      });
    });
    return map;
  }

  function unlockedKeySet() {
    const set = new Set();
    DATA.forEach((band) => {
      if (isBandLocked(band)) return;
      band.items.forEach((_, idx) => set.add(itemKey(band.month, idx)));
    });
    return set;
  }

  function updateProgress() {
    const unlocked = unlockedKeySet();
    const answered = Object.keys(responses).filter((k) => unlocked.has(k)).length;
    const total = totalItems();
    document.getElementById("progress-nums").textContent = answered + " / " + total;
    document.getElementById("progress-fill").style.width = (total ? (answered / total) * 100 : 0) + "%";
  }

  function updateResult() {
    const s = t();
    const unlocked = unlockedKeySet();
    const relevantEntries = Object.entries(responses).filter(([k]) => unlocked.has(k));
    const answered = relevantEntries.length;
    const notYet = relevantEntries.filter(([, v]) => v === "notyet").length;
    const badge = document.getElementById("result-badge");
    const title = document.getElementById("result-title");
    const text = document.getElementById("result-text");
    const breakdown = document.getElementById("domain-breakdown");

    if (answered === 0) {
      badge.textContent = "–";
      badge.classList.remove("flag");
      title.textContent = s.resultEmptyTitle;
      text.textContent = s.resultEmptyText;
      breakdown.style.display = "none";
      return;
    }

    badge.textContent = notYet;

    const domainMap = itemsByDomain();
    const domainCounts = {};
    let worstDomain = null;
    let worstCount = 0;
    Object.keys(domainMap).forEach((d) => {
      const count = domainMap[d].filter((k) => responses[k] === "notyet").length;
      domainCounts[d] = count;
      if (count > worstCount) {
        worstCount = count;
        worstDomain = d;
      }
    });

    breakdown.style.display = "flex";
    breakdown.innerHTML = Object.keys(domainCounts)
      .map((d) => "<span>" + DOMAIN_LABELS[locale][d] + " <b>" + domainCounts[d] + "</b></span>")
      .join("");

    if (notYet === 0) {
      badge.classList.remove("flag");
      title.textContent = s.resultNoneTitle;
      text.textContent = s.resultNoneText;
    } else if (notYet <= 3) {
      badge.classList.add("flag");
      title.textContent = s.resultFewTitle;
      text.textContent = s.resultFewText;
    } else {
      badge.classList.add("flag");
      title.textContent = s.resultManyTitle;
      text.textContent = s.resultManyText;
    }

    if (worstDomain && worstCount >= 3) {
      text.textContent += s.worstDomainNote(DOMAIN_LABELS[locale][worstDomain]);
    }
  }

  const childAgeInput = document.getElementById("child-age-input");
  childAgeInput.value = childAgeMonths === null ? "" : String(childAgeMonths);
  childAgeInput.addEventListener("input", () => {
    const raw = childAgeInput.value.trim();
    if (raw === "") {
      childAgeMonths = null;
      localStorage.removeItem(CHILD_AGE_KEY);
    } else {
      const n = parseInt(raw, 10);
      childAgeMonths = Number.isFinite(n) && n >= 0 ? n : null;
      if (childAgeMonths !== null) localStorage.setItem(CHILD_AGE_KEY, String(childAgeMonths));
    }
    render();
  });

  document.getElementById("reset-checklist-btn").addEventListener("click", () => {
    if (confirm(t().resetChecklistConfirm)) {
      responses = {};
      localStorage.removeItem(STORAGE_KEY);
      render();
    }
  });

  // ---- Tabs ----
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach((b) => {
        b.classList.remove("active");
        b.setAttribute("aria-selected", "false");
      });
      document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
      btn.classList.add("active");
      btn.setAttribute("aria-selected", "true");
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
    });
  });

  // ---- Language toggle ----
  document.getElementById("lang-toggle").addEventListener("click", () => {
    locale = locale === "en" ? "ko" : "en";
    localStorage.setItem(LOCALE_KEY, locale);
    applyStaticText();
    render();
    renderGrowth();
  });

  // ---- Print & share ----
  function composeShareText() {
    const s = t();
    const unlocked = unlockedKeySet();
    const answeredKeys = Object.keys(responses).filter((k) => unlocked.has(k));
    if (answeredKeys.length === 0) return null;

    const lines = [s.shareTitle, ""];
    lines.push(document.getElementById("result-title").textContent);
    lines.push(document.getElementById("result-text").textContent);
    lines.push("");
    lines.push(s.shareNotYetLabel + ":");

    const notYetLines = [];
    DATA.forEach((band) => {
      if (isBandLocked(band)) return;
      band.items.forEach((item, idx) => {
        const key = itemKey(band.month, idx);
        if (responses[key] === "notyet") {
          notYetLines.push("- [" + band.label[locale] + " / " + DOMAIN_LABELS[locale][item.domain] + "] " + item[locale]);
        }
      });
    });
    lines.push(notYetLines.length ? notYetLines.join("\n") : s.shareNoneFlagged);

    return lines.join("\n");
  }

  document.getElementById("print-btn").addEventListener("click", () => {
    window.print();
  });

  document.getElementById("share-btn").addEventListener("click", async () => {
    const s = t();
    const statusEl = document.getElementById("share-status");
    const text = composeShareText();
    if (!text) {
      statusEl.textContent = s.shareNoneYet;
      return;
    }
    if (navigator.share) {
      try {
        await navigator.share({ title: s.shareTitle, text });
        return;
      } catch (e) {
        // fall through to clipboard on cancel/failure
      }
    }
    try {
      await navigator.clipboard.writeText(text);
      statusEl.textContent = s.shareCopied;
    } catch (e) {
      statusEl.textContent = s.shareFailed;
    }
  });

  // ---- Growth log ----
  const GROWTH_KEY = "dev-growth-log-v1";
  let growthEntries = [];
  try {
    growthEntries = JSON.parse(localStorage.getItem(GROWTH_KEY)) || [];
  } catch (e) {
    growthEntries = [];
  }

  function saveGrowth() {
    localStorage.setItem(GROWTH_KEY, JSON.stringify(growthEntries));
  }

  function renderGrowth() {
    const s = t();
    growthEntries.sort((a, b) => a.date.localeCompare(b.date));

    const tbody = document.getElementById("growth-table-body");
    const table = document.getElementById("growth-table");
    const empty = document.getElementById("growth-empty");
    document.getElementById("growth-note2").textContent = s.growthNote2;
    tbody.innerHTML = "";

    if (growthEntries.length === 0) {
      table.style.display = "none";
      empty.style.display = "block";
      empty.textContent = s.growthEmpty;
    } else {
      table.style.display = "table";
      empty.style.display = "none";
      growthEntries.forEach((entry) => {
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + entry.date + "</td>" +
          "<td>" + (entry.height != null ? entry.height : "–") + "</td>" +
          "<td>" + (entry.weight != null ? entry.weight : "–") + "</td>" +
          '<td class="del"><button type="button" data-id="' + entry.id + '" aria-label="' + s.deleteEntryAria(entry.date) + '">' + s.delBtn + "</button></td>";
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll("button[data-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          growthEntries = growthEntries.filter((e) => String(e.id) !== btn.dataset.id);
          saveGrowth();
          renderGrowth();
        });
      });
    }

    drawChart("chart-height", growthEntries.filter((e) => e.height != null).map((e) => ({ date: e.date, value: e.height })));
    drawChart("chart-weight", growthEntries.filter((e) => e.weight != null).map((e) => ({ date: e.date, value: e.weight })));
  }

  function drawChart(canvasId, points) {
    const canvas = document.getElementById(canvasId);
    const emptyEl = document.getElementById(canvasId + "-empty");
    const ctx = canvas.getContext("2d");
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = rect.width || 560;
    const h = 140;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (points.length < 2) {
      canvas.style.display = "none";
      emptyEl.style.display = "block";
      return;
    }
    canvas.style.display = "block";
    emptyEl.style.display = "none";

    const pad = { top: 10, right: 10, bottom: 10, left: 34 };
    const plotW = w - pad.left - pad.right;
    const plotH = h - pad.top - pad.bottom;

    const values = points.map((p) => p.value);
    let min = Math.min(...values);
    let max = Math.max(...values);
    if (min === max) { min -= 1; max += 1; }
    const margin = (max - min) * 0.15;
    min -= margin;
    max += margin;

    const styles = getComputedStyle(document.documentElement);
    const line = styles.getPropertyValue("--line").trim();
    const sage = styles.getPropertyValue("--sage").trim();
    const amber = styles.getPropertyValue("--amber").trim();
    const inkFaint = styles.getPropertyValue("--ink-faint").trim();

    ctx.strokeStyle = line;
    ctx.lineWidth = 1;
    ctx.font = "10px " + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = inkFaint;
    for (let i = 0; i <= 3; i++) {
      const y = pad.top + (plotH / 3) * i;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(w - pad.right, y);
      ctx.stroke();
      const val = max - ((max - min) / 3) * i;
      ctx.fillText(val.toFixed(1), 2, y + 3);
    }

    const xFor = (i) => pad.left + (points.length === 1 ? 0 : (plotW / (points.length - 1)) * i);
    const yFor = (v) => pad.top + plotH - ((v - min) / (max - min)) * plotH;

    ctx.beginPath();
    points.forEach((p, i) => {
      const x = xFor(i);
      const y = yFor(p.value);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.lineTo(xFor(points.length - 1), pad.top + plotH);
    ctx.lineTo(xFor(0), pad.top + plotH);
    ctx.closePath();
    ctx.fillStyle = sage + "22";
    ctx.fill();

    ctx.beginPath();
    points.forEach((p, i) => {
      const x = xFor(i);
      const y = yFor(p.value);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = sage;
    ctx.lineWidth = 2;
    ctx.stroke();

    points.forEach((p, i) => {
      const x = xFor(i);
      const y = yFor(p.value);
      const isLast = i === points.length - 1;
      ctx.beginPath();
      ctx.arc(x, y, isLast ? 4 : 2.5, 0, Math.PI * 2);
      ctx.fillStyle = isLast ? amber : sage;
      ctx.fill();
    });
  }

  document.getElementById("growth-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const date = document.getElementById("g-date").value;
    const heightVal = document.getElementById("g-height").value;
    const weightVal = document.getElementById("g-weight").value;
    if (!date || (!heightVal && !weightVal)) return;

    growthEntries.push({
      id: date + "-" + Math.random().toString(36).slice(2, 8),
      date,
      height: heightVal ? parseFloat(heightVal) : null,
      weight: weightVal ? parseFloat(weightVal) : null,
    });
    saveGrowth();
    e.target.reset();
    renderGrowth();
  });

  document.getElementById("reset-growth-btn").addEventListener("click", () => {
    if (confirm(t().resetGrowthConfirm)) {
      growthEntries = [];
      localStorage.removeItem(GROWTH_KEY);
      renderGrowth();
    }
  });

  applyStaticText();
  render();
  renderGrowth();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
