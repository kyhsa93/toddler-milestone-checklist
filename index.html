<style>
  :root {
    --paper: #f1f4ee;
    --paper-raised: #ffffff;
    --ink: #263029;
    --ink-soft: #5b6a5f;
    --ink-faint: #8b988e;
    --sage: #5c7a64;
    --sage-deep: #3f5b47;
    --sage-pale: #e2ebe1;
    --amber: #c97c2c;
    --amber-pale: #f7e9d6;
    --critical: #b3261e;
    --critical-pale: #fbe4e2;
    --line: #d7ded2;
    --shadow: 0 1px 2px rgba(38, 48, 41, 0.06), 0 4px 14px rgba(38, 48, 41, 0.05);
    --font-display: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --font-body: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Roboto Mono", "Noto Sans Mono CJK KR", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #182119;
      --paper-raised: #202b22;
      --ink: #e9efe6;
      --ink-soft: #adbdae;
      --ink-faint: #71847a;
      --sage: #8fb49b;
      --sage-deep: #b7d4c1;
      --sage-pale: #26362b;
      --amber: #e2a15c;
      --amber-pale: #3a2e1c;
      --critical: #ff6b5e;
      --critical-pale: #4a2420;
      --line: #33402f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.25);
    }
  }
  :root[data-theme="dark"] {
    --paper: #182119;
    --paper-raised: #202b22;
    --ink: #e9efe6;
    --ink-soft: #adbdae;
    --ink-faint: #71847a;
    --sage: #8fb49b;
    --sage-deep: #b7d4c1;
    --sage-pale: #26362b;
    --amber: #e2a15c;
    --amber-pale: #3a2e1c;
    --critical: #ff6b5e;
    --critical-pale: #4a2420;
    --line: #33402f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.25);
  }
  :root[data-theme="light"] {
    --paper: #f1f4ee;
    --paper-raised: #ffffff;
    --ink: #263029;
    --ink-soft: #5b6a5f;
    --ink-faint: #8b988e;
    --sage: #5c7a64;
    --sage-deep: #3f5b47;
    --sage-pale: #e2ebe1;
    --amber: #c97c2c;
    --amber-pale: #f7e9d6;
    --critical: #b3261e;
    --critical-pale: #fbe4e2;
    --line: #d7ded2;
    --shadow: 0 1px 2px rgba(38, 48, 41, 0.06), 0 4px 14px rgba(38, 48, 41, 0.05);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* Masthead */
  .masthead { padding: 6px 2px 22px; border-bottom: 1px solid var(--line); }
  .masthead-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--sage-deep);
    background: var(--sage-pale);
    border: 1px solid var(--line);
    padding: 4px 10px;
    border-radius: 3px;
  }
  .lang-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper-raised);
    color: var(--ink);
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .lang-toggle:hover { border-color: var(--sage); }
  .lang-toggle:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(26px, 6vw, 32px);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 14px 0 6px;
    text-wrap: balance;
  }
  .sub { color: var(--ink-soft); font-size: 15px; max-width: 46ch; }
  .age-chip {
    display: inline-block;
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink);
    border: 1px solid var(--line);
    background: var(--paper-raised);
    padding: 5px 10px;
    border-radius: 3px;
  }

  /* Disclaimer stamp */
  .stamp {
    margin-top: 22px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    border-radius: 4px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .stamp-title {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--amber);
    margin-bottom: 8px;
  }
  .stamp ul { margin: 0; padding-left: 18px; }
  .stamp li { font-size: 14px; color: var(--ink-soft); margin-bottom: 5px; }
  .stamp li:last-child { margin-bottom: 0; }
  .stamp strong { color: var(--ink); font-weight: 600; }

  /* Sensory reference note */
  .sensory-note {
    margin-top: 14px;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 18px;
    background: var(--sage-pale);
  }
  .sensory-note-title {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--sage-deep);
    margin-bottom: 6px;
  }
  .sensory-note p { font-size: 13.5px; color: var(--ink-soft); margin: 0; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    margin-top: 24px;
    border-bottom: 1px solid var(--line);
  }
  .tab-btn {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 4px;
    margin-right: 18px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--ink-faint);
    cursor: pointer;
  }
  .tab-btn.active { color: var(--sage-deep); border-bottom-color: var(--sage); }
  .tab-btn:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Age setting */
  .age-setting {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 16px;
  }
  .age-setting label { font-size: 13.5px; color: var(--ink); flex-shrink: 0; }
  .age-setting input, .age-setting select {
    font-family: var(--font-body);
    font-size: 14px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
  }
  .age-setting input:focus-visible, .age-setting select:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .age-setting-hint { font-size: 12px; color: var(--ink-faint); flex-basis: 100%; }
  .age-setting-hint.current-age { color: var(--sage-deep); font-weight: 600; }

  /* Sticky progress */
  .progress-bar {
    position: sticky;
    top: 0;
    z-index: 5;
    margin-top: 18px;
    background: var(--paper);
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .progress-track {
    flex: 1;
    height: 5px;
    background: var(--sage-pale);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--sage);
    transition: width 0.25s ease;
  }
  .progress-nums { white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* Age band section */
  .band {
    margin-top: 30px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .band-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--sage-pale);
  }
  .band-month {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 600;
    color: var(--sage-deep);
    font-variant-numeric: tabular-nums;
  }
  .band-label { font-size: 14px; color: var(--ink-soft); }
  .band-tally {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .band.locked { opacity: 0.6; }
  .band.locked .band-head { background: var(--paper); }
  .band-locked-note {
    padding: 14px 18px;
    font-size: 13px;
    color: var(--ink-faint);
    font-style: italic;
  }

  .band-tips { margin: 4px 18px 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  .band-tips summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--sage-deep);
  }
  .band-tips summary:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }
  .band-tips-item { margin-top: 10px; font-size: 13.5px; color: var(--ink-soft); }
  .band-tips-item .item-domain { margin-right: 6px; margin-bottom: 0; vertical-align: middle; }
  .band-tips-source { margin-top: 10px; font-size: 11.5px; color: var(--ink-faint); }

  /* Regression check */
  .regression-check {
    margin-top: 30px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    border-radius: 4px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .regression-check-title {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--amber);
    margin-bottom: 8px;
  }
  .regression-check p { font-size: 14px; color: var(--ink-soft); margin: 0 0 12px; }
  .regression-toggle { display: flex; gap: 8px; flex-wrap: wrap; }
  .regression-toggle button {
    font-family: var(--font-body);
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .regression-toggle button:hover { border-color: var(--sage); }
  .regression-toggle button:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .regression-toggle button.active-safe { background: var(--sage); border-color: var(--sage); color: #fff; }
  .regression-toggle button.active-concern { background: var(--amber); border-color: var(--amber); color: #fff; }

  /* Symptom check */
  .symptom-disclaimer {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-left: 3px solid var(--critical);
    border-radius: 4px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .symptom-disclaimer-title {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--critical);
    margin-bottom: 8px;
  }
  .symptom-disclaimer p { font-size: 14px; color: var(--ink-soft); margin: 0 0 8px; }
  .symptom-disclaimer p:last-child { margin-bottom: 0; }

  .symptom-card {
    margin-top: 24px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .symptom-card-head {
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--sage-pale);
    font-size: 15px;
    font-weight: 700;
  }
  .symptom-card-body { padding: 4px 18px 18px; }

  .symptom-numeric-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    padding-top: 14px;
  }
  .symptom-numeric-field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin-bottom: 4px;
  }
  .symptom-numeric-field input {
    width: 90px;
    font-family: var(--font-body);
    font-size: 14px;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
  }
  .symptom-numeric-field input:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .symptom-age-note { font-size: 12px; color: var(--ink-faint); margin-top: 8px; }

  .symptom-group-title {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    font-weight: 600;
    margin-top: 16px;
    margin-bottom: 6px;
  }
  .symptom-group-title.tier1 { color: var(--critical); }
  .symptom-group-title.tier2 { color: var(--amber); }

  .symptom-check-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 7px 0;
  }
  .symptom-check-row input[type="checkbox"] {
    margin-top: 3px;
    width: 17px;
    height: 17px;
    accent-color: var(--sage);
    flex-shrink: 0;
  }
  .symptom-check-row label { font-size: 14px; color: var(--ink); }
  .symptom-card-body ol { margin: 8px 0 16px; padding-left: 22px; font-size: 14px; color: var(--ink); }
  .symptom-card-body ol li { margin-bottom: 6px; }

  .symptom-result {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 4px;
    border: 1px solid var(--line);
    font-size: 14px;
  }
  .symptom-result-tier {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    font-weight: 700;
    margin-bottom: 6px;
    display: inline-block;
  }
  .symptom-result-title { font-weight: 700; margin-bottom: 4px; }
  .symptom-result-text { color: var(--ink-soft); }
  .symptom-result.tier1 { background: var(--critical-pale); border-color: var(--critical); }
  .symptom-result.tier1 .symptom-result-tier { color: var(--critical); }
  .symptom-result.tier2 { background: var(--amber-pale); border-color: var(--amber); }
  .symptom-result.tier2 .symptom-result-tier { color: var(--amber); }
  .symptom-result.tier3 { background: var(--paper); border-color: var(--line); }
  .symptom-result.tier3 .symptom-result-tier { color: var(--ink-soft); }
  .symptom-result.tier4 { background: var(--sage-pale); border-color: var(--sage); }
  .symptom-result.tier4 .symptom-result-tier { color: var(--sage-deep); }

  .symptom-footer-note { font-size: 12px; color: var(--ink-faint); margin-top: 24px; }

  /* ---- 야간·휴일 약국 / 응급실 ---- */
  .nearby-intro { font-size: 13px; color: var(--ink-soft); margin: 0 0 16px; }
  .nearby-controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .nearby-control-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .nearby-control-row label { font-size: 13px; color: var(--ink-soft); }
  .nearby-control-row select,
  .nearby-control-row input[type="search"] {
    flex: 1;
    min-width: 120px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .nearby-check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .nearby-locate-btn {
    flex-shrink: 0;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 13px;
    color: var(--sage-deep);
    background: var(--sage-pale);
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
  }
  .nearby-locate-btn[aria-pressed="true"] { background: var(--sage); color: #fff; }
  .nearby-status { font-size: 13px; color: var(--ink-soft); margin: 0 0 12px; }
  .nearby-item {
    padding: 14px 16px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
  }
  .nearby-item-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .nearby-item-name { font-weight: 600; font-size: 15px; }
  .nearby-badge {
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--sage-pale);
    color: var(--sage-deep);
  }
  .nearby-badge.closed { background: var(--line); color: var(--ink-faint); }
  .nearby-badge.distance { background: var(--amber-pale); color: var(--amber); }
  .nearby-item-addr { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .nearby-item-hours { font-size: 12px; color: var(--ink-faint); margin-top: 4px; }
  .nearby-item-actions { margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
  .nearby-item-actions a { font-size: 13px; color: var(--sage-deep); }
  .nearby-empty { font-size: 13px; color: var(--ink-faint); padding: 20px 0; }
  .nearby-more-btn {
    width: 100%;
    padding: 12px;
    margin-top: 4px;
    font-family: inherit;
    font-size: 14px;
    color: var(--sage-deep);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }
  .nearby-more-btn:hover { background: var(--sage-pale); }

  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: none; }
  .item-body { flex: 1; min-width: 0; }
  .item-domain {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.03em;
    color: var(--ink-faint);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 6px;
    margin-bottom: 5px;
  }
  .item-text { font-size: 14.5px; }
  .toggle { display: flex; gap: 6px; flex-shrink: 0; }
  .toggle button {
    font-family: var(--font-body);
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .toggle button:hover { border-color: var(--sage); }
  .toggle button:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .toggle button.active-yes { background: var(--sage); border-color: var(--sage); color: #fff; }
  .toggle button.active-notyet { background: var(--amber); border-color: var(--amber); color: #fff; }

  /* Result stamp */
  .result {
    margin-top: 34px;
    padding: 24px 22px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper-raised);
    box-shadow: var(--shadow);
    text-align: center;
  }
  .result-badge {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid var(--sage);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
    color: var(--sage-deep);
    font-variant-numeric: tabular-nums;
  }
  .result-badge.flag { border-color: var(--amber); color: var(--amber); }
  .result-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .result-text { font-size: 14px; color: var(--ink-soft); max-width: 44ch; margin: 0 auto 14px; }
  .domain-breakdown-wrap { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 4px; }
  .domain-breakdown-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    text-align: center;
    margin-bottom: 8px;
  }
  .domain-breakdown {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .domain-breakdown b { color: var(--ink-soft); font-weight: 600; }

  /* Growth tab */
  .growth-form {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 8px;
    margin-top: 20px;
    align-items: end;
  }
  .growth-form label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin-bottom: 4px;
  }
  .growth-form input {
    width: 100%;
    font-family: var(--font-body);
    font-size: 14px;
    padding: 8px 9px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper-raised);
    color: var(--ink);
  }
  .growth-form input:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .growth-form button {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 4px;
    border: 1px solid var(--sage);
    background: var(--sage);
    color: #fff;
    cursor: pointer;
  }
  @media (max-width: 480px) {
    .growth-form { grid-template-columns: 1fr 1fr; }
    .growth-form button { grid-column: span 2; }
  }

  .chart-card {
    margin-top: 24px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 16px 18px;
  }
  .chart-title {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .chart-card canvas { width: 100%; height: 140px; display: block; }
  .chart-empty { font-size: 13px; color: var(--ink-faint); padding: 30px 0; text-align: center; }

  .growth-table {
    margin-top: 24px;
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  .growth-table th, .growth-table td {
    text-align: left;
    padding: 9px 8px;
    border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .growth-table th {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    font-weight: 500;
    letter-spacing: 0.03em;
  }
  .growth-table td.del {
    text-align: right;
  }
  .growth-table td.del button {
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--ink-faint);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }
  .growth-table td.del button:hover { color: var(--amber); }
  .growth-empty { font-size: 13px; color: var(--ink-faint); margin-top: 18px; }

  footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  footer p { font-size: 12px; color: var(--ink-faint); max-width: 34ch; margin: 0; }
  .footer-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .footer-share-status {
    flex-basis: 100%;
    font-size: 12px;
    color: var(--sage-deep);
    margin: 0;
  }
  .share-app-btn {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 4px;
    border: 1px solid var(--sage);
    background: var(--sage);
    color: #fff;
    cursor: pointer;
  }
  .share-app-btn:hover { background: var(--sage-deep); border-color: var(--sage-deep); }
  .share-app-btn:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .reset-btn {
    font-family: var(--font-body);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .reset-btn:hover { border-color: var(--amber); color: var(--amber); }
  .reset-btn:focus-visible, .lang-toggle:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }

  .result-actions {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .result-actions button {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 4px;
    border: 1px solid var(--sage);
    background: var(--paper-raised);
    color: var(--sage-deep);
    cursor: pointer;
  }
  .result-actions button:hover { background: var(--sage-pale); }
  .result-actions button:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }

  @media (prefers-reduced-motion: reduce) {
    .progress-fill { transition: none; }
  }

  .item-print-state { display: none; font-weight: 600; }

  @media print {
    .lang-toggle, .tabs, .age-setting, .toggle, .growth-form,
    .result-actions, footer, .progress-bar, .regression-toggle { display: none !important; }
    .tab-panel { display: block !important; }
    .item-print-state { display: inline; }
    body { background: #fff; color: #000; }
    .band, .result, .chart-card, .stamp, .sensory-note { box-shadow: none; break-inside: avoid; }
  }
</style>
</head>

<div class="wrap">

      <li id="txt-disclaimer-4"></li>
      <li id="txt-disclaimer-5"></li>
      <li id="txt-disclaimer-6"></li>

      <option value="girl" id="txt-sex-girl-option"></option>

    <span class="age-setting-hint" id="txt-current-age-display"></span>
    <span class="age-setting-hint" id="txt-age-setting-hint"></span>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab-btn active" type="button" role="tab" aria-selected="true" aria-controls="panel-checklist" id="tab-checklist" data-tab="checklist"><span id="txt-tab-checklist"></span></button>
    <button class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="panel-growth" id="tab-growth" data-tab="growth"><span id="txt-tab-growth"></span></button>

  </div>

  <section class="tab-panel active" id="panel-checklist" role="tabpanel" aria-labelledby="tab-checklist" tabindex="0">
    <div class="progress-bar">
      <div class="progress-row">
        <span id="txt-progress-label"></span>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="progress-nums" id="progress-nums">0 / 0</span>
      </div>
    </div>

    <main id="bands"></main>

    <div class="regression-check">
      <div class="regression-check-title" id="txt-regression-title"></div>
      <p id="txt-regression-text"></p>
      <div class="regression-toggle">
        <button type="button" id="regression-no"></button>

      </div>

    </div>

      <div class="result-title" id="result-title"></div>
      <div class="result-text" id="result-text"></div>
      <div class="domain-breakdown-wrap" id="domain-breakdown-wrap">

        <div class="domain-breakdown" id="domain-breakdown"></div>
      </div>
      <div class="result-actions">
        <button type="button" id="print-btn"></button>
      </div>
    </section>

  <section class="tab-panel" id="panel-growth" role="tabpanel" aria-labelledby="tab-growth" tabindex="0">
    <form class="growth-form" id="growth-form">
      <div>

    </div>
    <div class="chart-card">
      <div class="chart-title" id="txt-chart-weight-title"></div>
      <canvas id="chart-weight"></canvas>
      <div class="chart-empty" id="chart-weight-empty" style="display:none;"></div>
    </div>

    <table class="growth-table" id="growth-table" style="display:none;">
      <thead>
        <tr><th id="txt-gth-1"></th><th id="txt-gth-2"></th><th id="txt-gth-3"></th><th id="txt-gth-4"></th><th></th></tr>

    <p class="growth-empty" id="growth-empty"></p>
    <p class="growth-empty" id="growth-note2"></p>
    <p class="growth-empty" id="growth-percentile-note"></p>
  </section>

  <section class="tab-panel" id="panel-symptom" role="tabpanel" aria-labelledby="tab-symptom" tabindex="0">

      <div class="symptom-disclaimer-title" id="txt-symptom-disclaimer-title"></div>
      <p id="txt-symptom-disclaimer-1"></p>
      <p id="txt-symptom-disclaimer-2"></p>
      <p id="txt-symptom-disclaimer-3"></p>
    </div>
    <div id="symptom-cards"></div>
    <p class="symptom-footer-note" id="txt-symptom-footer-note"></p>
  </section>

  <section class="tab-panel" id="panel-care" role="tabpanel" aria-labelledby="tab-care" tabindex="0">

        <label for="nearby-sigungu" id="txt-nearby-sigungu-label"></label>

      </div>

          <input type="checkbox" id="nearby-open-now">

        </label>
      </div>
      <div class="nearby-control-row">
        <input type="search" id="nearby-search" autocomplete="off">
        <button class="nearby-locate-btn" type="button" id="nearby-locate-btn"></button>

    <p class="nearby-status" id="nearby-status"></p>
    <div id="nearby-list"></div>

  <footer>

    <div class="footer-actions">

      <button class="reset-btn" id="reset-checklist-btn" type="button"></button>
      <button class="reset-btn" id="reset-growth-btn" type="button"></button>
    </div>
    <p class="footer-share-status" id="app-share-status"></p>
  </footer>
</div>

  function t() {
    return STRINGS[locale];
  }

  const APP_URL = "https://kyhsa93.github.io/toddler-milestone-checklist/";

  const CHILD_BIRTHDATE_KEY = "dev-child-birthdate";
  const CHILD_SEX_KEY = "dev-child-sex";
  const LEGACY_CHILD_AGE_KEY = "dev-child-age-months";
  const DAYS_PER_MONTH = 30.4375;

  let childBirthdate = localStorage.getItem(CHILD_BIRTHDATE_KEY);
  let childSex = localStorage.getItem(CHILD_SEX_KEY);
  if (childSex !== "boy" && childSex !== "girl") childSex = null;

  // One-time migration from the old "current age in months" input to a
  // birthdate, so age keeps computing correctly instead of going stale.
  if (!childBirthdate) {
    const legacy = localStorage.getItem(LEGACY_CHILD_AGE_KEY);
    const legacyMonths = legacy === null ? NaN : parseInt(legacy, 10);
    if (Number.isFinite(legacyMonths) && legacyMonths >= 0) {
      const approx = new Date(Date.now() - legacyMonths * DAYS_PER_MONTH * 86400000);
      childBirthdate = approx.toISOString().slice(0, 10);
      localStorage.setItem(CHILD_BIRTHDATE_KEY, childBirthdate);
    }
  }
  localStorage.removeItem(LEGACY_CHILD_AGE_KEY);

  function ageMonthsFloatAt(dateStr) {
    if (!childBirthdate) return null;
    const birth = new Date(childBirthdate + "T00:00:00").getTime();
    const at = new Date(dateStr + "T00:00:00").getTime();
    if (!Number.isFinite(birth) || !Number.isFinite(at) || at < birth) return null;
    return (at - birth) / 86400000 / DAYS_PER_MONTH;
  }

  function currentAgeMonthsFloat() {
    if (!childBirthdate) return null;
    return ageMonthsFloatAt(new Date().toISOString().slice(0, 10));
  }

  function currentAgeMonthsInt() {
    const f = currentAgeMonthsFloat();
    return f === null ? null : Math.floor(f);
  }

  function isBandLocked(band) {
    const age = currentAgeMonthsInt();
    return age !== null && band.month > age;
  }

  function updateCurrentAgeDisplay() {
    const el = document.getElementById("txt-current-age-display");
    const age = currentAgeMonthsInt();
    if (age === null) {
      el.textContent = "";
      el.classList.remove("current-age");
    } else {
      el.textContent = t().currentAgeDisplay(age);
      el.classList.add("current-age");
    }
  }

  const REGRESSION_KEY = "dev-regression-flag";
  function getInitialRegressionFlag() {
    const saved = localStorage.getItem(REGRESSION_KEY);
    return saved === "yes" || saved === "no" ? saved : null;
  }
  let regressionFlag = getInitialRegressionFlag();

  function renderRegression() {
    const s = t();
    const noBtn = document.getElementById("regression-no");
    const yesBtn = document.getElementById("regression-yes");
    noBtn.classList.toggle("active-safe", regressionFlag === "no");
    yesBtn.classList.toggle("active-concern", regressionFlag === "yes");
    noBtn.setAttribute("aria-pressed", regressionFlag === "no" ? "true" : "false");
    yesBtn.setAttribute("aria-pressed", regressionFlag === "yes" ? "true" : "false");
    document.getElementById("regression-print-state").textContent =
      regressionFlag === "no" ? " — " + s.regressionNo : regressionFlag === "yes" ? " — " + s.regressionYes : "";
  }

  function setRegressionFlag(value) {
    regressionFlag = regressionFlag === value ? null : value;
    if (regressionFlag === null) localStorage.removeItem(REGRESSION_KEY);
    else localStorage.setItem(REGRESSION_KEY, regressionFlag);
    renderRegression();
    updateResult();
  }

  const STORAGE_KEY = "dev-checklist-responses-v3";
  let responses = {};
  try {
    responses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) {
    responses = {};
  }

  const bandsEl = document.getElementById("bands");

  function itemKey(month, idx) {
    return month + "-" + idx;
  }

  function render() {
    const s = t();
    bandsEl.innerHTML = "";
    DATA.forEach((band) => {
      const locked = isBandLocked(band);
      const section = document.createElement("section");
      section.className = "band" + (locked ? " locked" : "");

      const head = document.createElement("div");
      head.className = "band-head";
      const notYetCount = band.items.filter(
        (_, i) => responses[itemKey(band.month, i)] === "notyet"
      ).length;
      head.innerHTML =
        '<span class="band-month">' + band.month + "M</span>" +
        '<span class="band-label">' + band.label[locale] + "</span>" +
        '<span class="band-tally">' + (locked ? "🔒" : s.bandTally(notYetCount)) + "</span>";
      section.appendChild(head);

      if (locked) {
        const note = document.createElement("div");
        note.className = "band-locked-note";
        note.textContent = s.bandLockedNote(currentAgeMonthsInt());
        section.appendChild(note);
        bandsEl.appendChild(section);
        return;
      }

      band.items.forEach((item, idx) => {
        const key = itemKey(band.month, idx);
        const state = responses[key];

        const row = document.createElement("div");
        row.className = "item";

        const body = document.createElement("div");
        body.className = "item-body";
        const domainTag = document.createElement("div");
        domainTag.className = "item-domain";
        domainTag.textContent = DOMAIN_LABELS[locale][item.domain];
        const label = document.createElement("div");
        label.className = "item-text";
        label.textContent = item[locale];
        const printState = document.createElement("span");
        printState.className = "item-print-state";
        printState.textContent = state === "yes" ? " — " + s.printStateYes : state === "notyet" ? " — " + s.printStateNotYet : "";
        label.appendChild(printState);
        body.appendChild(domainTag);
        body.appendChild(label);
        row.appendChild(body);

        const toggle = document.createElement("div");
        toggle.className = "toggle";

        const yesBtn = document.createElement("button");
        yesBtn.type = "button";
        yesBtn.textContent = s.yesBtn;
        yesBtn.setAttribute("aria-pressed", state === "yes" ? "true" : "false");
        if (state === "yes") yesBtn.classList.add("active-yes");
        yesBtn.addEventListener("click", () => setResponse(key, state === "yes" ? null : "yes"));

        const notYetBtn = document.createElement("button");
        notYetBtn.type = "button";
        notYetBtn.textContent = s.notYetBtn;
        notYetBtn.setAttribute("aria-pressed", state === "notyet" ? "true" : "false");
        if (state === "notyet") notYetBtn.classList.add("active-notyet");
        notYetBtn.addEventListener("click", () => setResponse(key, state === "notyet" ? null : "notyet"));

        toggle.appendChild(yesBtn);
        toggle.appendChild(notYetBtn);
        row.appendChild(toggle);
        section.appendChild(row);
      });

      const tips = PLAY_TIPS[band.month];
      if (tips) {
        const details = document.createElement("details");
        details.className = "band-tips";
        const summary = document.createElement("summary");
        summary.textContent = s.tipsToggleLabel;
        details.appendChild(summary);
        Object.keys(DOMAIN_LABELS[locale]).forEach((domainKey) => {
          const tip = tips[domainKey];
          if (!tip) return;
          const item = document.createElement("div");
          item.className = "band-tips-item";
          const tag = document.createElement("span");
          tag.className = "item-domain";
          tag.textContent = DOMAIN_LABELS[locale][domainKey];
          item.appendChild(tag);
          item.appendChild(document.createTextNode(tip[locale]));
          details.appendChild(item);
        });
        const source = document.createElement("div");
        source.className = "band-tips-source";
        source.textContent = s.tipsSourceNote;
        details.appendChild(source);
        section.appendChild(details);
      }

      bandsEl.appendChild(section);
    });

    updateProgress();
    updateResult();
  }

  function setResponse(key, value) {
    if (value === null) {
      delete responses[key];
    } else {
      responses[key] = value;
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(responses));
    render();
  }

  function totalItems() {
    return DATA.reduce((sum, b) => sum + (isBandLocked(b) ? 0 : b.items.length), 0);
  }

  function itemsByDomain() {
    const map = { social: [], language: [], cognitive: [], physical: [] };
    DATA.forEach((band) => {
      if (isBandLocked(band)) return;
      band.items.forEach((item, idx) => {
        map[item.domain].push(itemKey(band.month, idx));
      });
    });
    return map;
  }

  function unlockedKeySet() {
    const set = new Set();
    DATA.forEach((band) => {
      if (isBandLocked(band)) return;
      band.items.forEach((_, idx) => set.add(itemKey(band.month, idx)));
    });
    return set;
  }

  function updateProgress() {
    const unlocked = unlockedKeySet();
    const answered = Object.keys(responses).filter((k) => unlocked.has(k)).length;
    const total = totalItems();
    document.getElementById("progress-nums").textContent = answered + " / " + total;
    document.getElementById("progress-fill").style.width = (total ? (answered / total) * 100 : 0) + "%";
  }

  function updateResult() {
    const s = t();
    const unlocked = unlockedKeySet();
    const relevantEntries = Object.entries(responses).filter(([k]) => unlocked.has(k));
    const answered = relevantEntries.length;
    const notYet = relevantEntries.filter(([, v]) => v === "notyet").length;
    const badge = document.getElementById("result-badge");
    const title = document.getElementById("result-title");
    const text = document.getElementById("result-text");
    const breakdown = document.getElementById("domain-breakdown");
    const breakdownWrap = document.getElementById("domain-breakdown-wrap");

    if (answered === 0 && regressionFlag !== "yes") {
      badge.textContent = "–";
      badge.classList.remove("flag");
      title.textContent = s.resultEmptyTitle;
      text.textContent = s.resultEmptyText;
      breakdownWrap.style.display = "none";
      return;
    }

    if (regressionFlag === "yes") {
      badge.textContent = "!";
      badge.classList.add("flag");
      title.textContent = s.regressionResultTitle;
      text.textContent = s.regressionResultText;
      breakdownWrap.style.display = "none";
      return;
    }

    badge.textContent = notYet;

    const domainMap = itemsByDomain();
    const domainCounts = {};
    let worstDomain = null;
    let worstCount = 0;
    Object.keys(domainMap).forEach((d) => {
      const count = domainMap[d].filter((k) => responses[k] === "notyet").length;
      domainCounts[d] = count;
      if (count > worstCount) {
        worstCount = count;
        worstDomain = d;
      }
    });

    breakdownWrap.style.display = "block";
    breakdown.innerHTML = Object.keys(domainCounts)
      .map((d) => "<span>" + DOMAIN_LABELS[locale][d] + " <b>" + domainCounts[d] + "</b></span>")
      .join("");

    if (notYet === 0) {
      badge.classList.remove("flag");
      title.textContent = s.resultNoneTitle;
      text.textContent = s.resultNoneText;
    } else if (notYet <= 3) {
      badge.classList.add("flag");
      title.textContent = s.resultFewTitle;
      text.textContent = s.resultFewText;
    } else {
      badge.classList.add("flag");
      title.textContent = s.resultManyTitle;
      text.textContent = s.resultManyText;
    }

    if (worstDomain && worstCount >= 3) {
      text.textContent += s.worstDomainNote(DOMAIN_LABELS[locale][worstDomain]);
    }
  }

  document.getElementById("regression-no").addEventListener("click", () => setRegressionFlag("no"));
  document.getElementById("regression-yes").addEventListener("click", () => setRegressionFlag("yes"));

  const birthdateInput = document.getElementById("child-birthdate-input");
  const sexInput = document.getElementById("child-sex-input");
  birthdateInput.max = new Date().toISOString().slice(0, 10);
  birthdateInput.value = childBirthdate || "";
  sexInput.value = childSex || "";

  birthdateInput.addEventListener("change", () => {
    const raw = birthdateInput.value;
    childBirthdate = raw || null;
    if (childBirthdate) localStorage.setItem(CHILD_BIRTHDATE_KEY, childBirthdate);
    else localStorage.removeItem(CHILD_BIRTHDATE_KEY);
    updateCurrentAgeDisplay();
    render();
    renderGrowth();
    renderSymptomCards();
    renderCareCards();
  });

  sexInput.addEventListener("change", () => {
    const raw = sexInput.value;
    childSex = raw === "boy" || raw === "girl" ? raw : null;
    if (childSex) localStorage.setItem(CHILD_SEX_KEY, childSex);
    else localStorage.removeItem(CHILD_SEX_KEY);
    renderGrowth();
  });

  // Shares the app's name/description/URL by default — reads `responses`/
  // `regressionFlag` ONLY to ask the user whether to append the result, and
  // only appends it if they explicitly say yes. Never reads `growthEntries`,
  // `childBirthdate`, or `childSex`, so growth/personal data can never leak in.
  document.getElementById("share-app-btn").addEventListener("click", async () => {
    const s = t();
    const statusEl = document.getElementById("app-share-status");
    statusEl.textContent = "";

    const resultSummary = composeResultSummaryText();
    const includeResult = resultSummary ? confirm(s.shareIncludeResultConfirm) : false;

    const lines = [s.shareAppTitle, s.shareAppText, APP_URL];
    if (includeResult) {
      lines.push("");
      lines.push(resultSummary);
    }
    const text = lines.join("\n");

    if (navigator.share) {
      try {
        await navigator.share({ title: s.shareAppTitle, text });
        return;
      } catch (e) {
        // fall through to clipboard on cancel/failure
      }
    }
    try {
      await navigator.clipboard.writeText(text);
      statusEl.textContent = includeResult ? s.shareCopiedWithResult : s.shareAppCopied;
    } catch (e) {
      statusEl.textContent = s.shareAppFailed + " " + APP_URL;
    }
  });

  document.getElementById("reset-checklist-btn").addEventListener("click", () => {
    if (confirm(t().resetChecklistConfirm)) {
      responses = {};
      localStorage.removeItem(STORAGE_KEY);
      render();
    }
  });

  // ---- Tabs ----
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach((b) => {
        b.classList.remove("active");
        b.setAttribute("aria-selected", "false");
      });
      document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
      btn.classList.add("active");
      btn.setAttribute("aria-selected", "true");
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
      // 약국·응급실 목록은 이 탭을 처음 열 때만 받는다(첫 화면 로딩을 늦추지 않도록).
      if (btn.dataset.tab === "nearby") initNearby();
    });
  });

  // 목록은 공공데이터에서 온 문자열(약국명·주소)을 그대로 넣기 때문에
  // innerHTML에 붙이기 전에 반드시 이스케이프한다.
  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // ---- 야간·휴일 약국 / 응급실 ----
  // 데이터는 GitHub Actions가 하루 한 번 받아 data/ 아래 시도별 JSON으로 넣어둔다
  // (API 트래픽이 하루 1,000건뿐이라 브라우저에서 직접 부를 수 없다).
  // 이 탭을 처음 열 때만 메타를 읽고, 목록은 지역을 고를 때마다 그 지역 파일만 받는다.
  const NEARBY_REGION_KEY = "nearbyRegion";
  const REGION_LABELS_EN = {
    seoul: "Seoul", busan: "Busan", daegu: "Daegu", incheon: "Incheon",
    gwangju: "Gwangju", daejeon: "Daejeon", ulsan: "Ulsan", sejong: "Sejong",
    gyeonggi: "Gyeonggi", gangwon: "Gangwon", chungbuk: "North Chungcheong",
    chungnam: "South Chungcheong", jeonbuk: "North Jeolla", jeonnam: "South Jeolla",
    gyeongbuk: "North Gyeongsang", gyeongnam: "South Gyeongsang", jeju: "Jeju",
  };

  // 한 시도의 야간 약국이 서울 2,400곳, 경기 2,672곳이다. 전부 그리면 화면이
  // 끝없이 길어져서 쓸 수가 없다. 시·군·구로 한 번 더 좁히고, 그러고도 남는
  // 목록은 끊어서 보여준다.
  const NEARBY_PAGE_SIZE = 20;

  const nearbyState = {
    kind: "pharmacy",
    region: localStorage.getItem(NEARBY_REGION_KEY) || "seoul",
    sigungu: "",
    openNow: false,
    query: "",
    coords: null,
    visibleCount: NEARBY_PAGE_SIZE,
  };
  const nearbyCache = new Map();
  let nearbyMeta = null;
  let nearbyLoaded = false;

  function nearbyRegionLabel(region) {
    return locale === "en" ? REGION_LABELS_EN[region.code] ?? region.name : region.name;
  }

  async function loadNearbyJson(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${url} ${res.status}`);
    return res.json();
  }

  async function nearbyList() {
    const key = `${nearbyState.kind}:${nearbyState.region}`;
    if (!nearbyCache.has(key)) {
      nearbyCache.set(key, await loadNearbyJson(`./data/${nearbyState.kind}/${nearbyState.region}.json`));
    }
    return nearbyCache.get(key);
  }

  /**
   * 주소에서 시·군·구를 뽑는다. 공공데이터 주소는 "시도 시군구 도로명 …" 순서라
   * 두 번째 낱말을 보면 되는데, 세종처럼 시군구가 없는 곳은 바로 도로명이 온다.
   * 그래서 구/시/군으로 끝날 때만 인정한다("경기도 안양시 만안구"는 안양시로 묶인다).
   */
  function sigunguOf(item) {
    const parts = (item.addr ?? "").trim().split(/\s+/);
    const second = parts[1] ?? "";
    return /[구시군]$/.test(second) ? second : "";
  }

  /** 요일 번호를 API 표기(1=월 … 7=일)로 맞춘다. Date.getDay()는 0=일이다. */
  function todayDutyDay() {
    const day = new Date().getDay();
    return day === 0 ? 7 : day;
  }

  function minutesNow() {
    const now = new Date();
    return now.getHours() * 60 + now.getMinutes();
  }

  function fmtMinutes(total) {
    // 새벽까지 여는 곳은 종료 시각이 2400을 넘겨서 온다(25:30 등).
    const wrapped = total % (24 * 60);
    const h = String(Math.floor(wrapped / 60)).padStart(2, "0");
    const m = String(wrapped % 60).padStart(2, "0");
    return `${h}:${m}`;
  }

  function todayHours(item) {
    return item.hours?.[String(todayDutyDay())] ?? null;
  }

  function isOpenNow(item) {
    const range = todayHours(item);
    if (!range) return false;
    const [open, close] = range;
    const now = minutesNow();
    // 자정을 넘겨 닫는 경우 "열림" 구간이 하루를 걸친다.
    if (close > 24 * 60) return now >= open || now <= close - 24 * 60;
    return now >= open && now <= close;
  }

  function distanceKm(a, b) {
    const toRad = (v) => (v * Math.PI) / 180;
    const R = 6371;
    const dLat = toRad(b.lat - a.lat);
    const dLon = toRad(b.lon - a.lon);
    const lat1 = toRad(a.lat);
    const lat2 = toRad(b.lat);
    const h =
      Math.sin(dLat / 2) ** 2 + Math.sin(dLon / 2) ** 2 * Math.cos(lat1) * Math.cos(lat2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function nearbyMapUrl(item) {
    if (item.lat && item.lon) {
      return `https://map.kakao.com/link/map/${encodeURIComponent(item.name)},${item.lat},${item.lon}`;
    }
    return `https://map.kakao.com/link/search/${encodeURIComponent(item.addr ?? item.name ?? "")}`;
  }

  function nearbyItemHtml(item, s) {
    const badges = [];
    if (nearbyState.kind === "pharmacy") {
      badges.push(
        isOpenNow(item)
          ? `<span class="nearby-badge">${escapeHtml(s.nearbyOpenBadge)}</span>`
          : `<span class="nearby-badge closed">${escapeHtml(s.nearbyClosedBadge)}</span>`
      );
      if (item.hours?.["8"]) {
        badges.push(`<span class="nearby-badge">${escapeHtml(s.nearbyHolidayBadge)}</span>`);
      }
    }
    if (item._distance !== undefined) {
      badges.push(
        `<span class="nearby-badge distance">${escapeHtml(
          s.nearbyDistance(item._distance < 10 ? item._distance.toFixed(1) : Math.round(item._distance))
        )}</span>`
      );
    }

    let hoursLine = "";
    if (nearbyState.kind === "pharmacy") {
      const range = todayHours(item);
      hoursLine = `<div class="nearby-item-hours">${escapeHtml(
        range ? s.nearbyTodayHours(fmtMinutes(range[0]), fmtMinutes(range[1])) : s.nearbyNoTodayHours
      )}</div>`;
    }

    const actions = [];
    if (item.tel) {
      actions.push(
        `<a href="tel:${encodeURIComponent(item.tel)}">${escapeHtml(s.nearbyCall)} ${escapeHtml(item.tel)}</a>`
      );
    }
    actions.push(
      `<a href="${nearbyMapUrl(item)}" target="_blank" rel="noopener">${escapeHtml(s.nearbyMap)}</a>`
    );

    return `<div class="nearby-item">
      <div class="nearby-item-head">
        <span class="nearby-item-name">${escapeHtml(item.name ?? "")}</span>
        ${badges.join("")}
      </div>
      <div class="nearby-item-addr">${escapeHtml(item.addr ?? "")}</div>
      ${hoursLine}
      <div class="nearby-item-actions">${actions.join("")}</div>
    </div>`;
  }

  async function renderNearby() {
    const s = STRINGS[locale];
    const statusEl = document.getElementById("nearby-status");
    const listEl = document.getElementById("nearby-list");

    // 응급실은 24시간 운영이라 "지금 문 연 곳" 필터가 의미 없다.
    document.getElementById("nearby-open-row").hidden = nearbyState.kind !== "pharmacy";

    let items;
    try {
      items = await nearbyList();
    } catch (err) {
      console.error("[nearby]", err.message);
      statusEl.textContent = s.nearbyError;
      listEl.innerHTML = "";
      return;
    }

    renderSigunguOptions(items);

    const query = nearbyState.query.trim().toLowerCase();
    let filtered = items.filter((item) => {
      if (nearbyState.kind === "pharmacy" && nearbyState.openNow && !isOpenNow(item)) return false;
      if (nearbyState.sigungu && sigunguOf(item) !== nearbyState.sigungu) return false;
      if (!query) return true;
      return `${item.name ?? ""} ${item.addr ?? ""}`.toLowerCase().includes(query);
    });

    if (nearbyState.coords) {
      filtered = filtered
        .map((item) => ({
          ...item,
          _distance:
            item.lat && item.lon ? distanceKm(nearbyState.coords, { lat: item.lat, lon: item.lon }) : undefined,
        }))
        .sort((a, b) => (a._distance ?? Infinity) - (b._distance ?? Infinity));
    }

    const updated = nearbyMeta?.updatedAt
      ? new Date(nearbyMeta.updatedAt).toLocaleDateString(locale === "ko" ? "ko-KR" : "en-US", {
          timeZone: "Asia/Seoul",
          dateStyle: "medium",
        })
      : null;

    // 화면에 실제로 그리는 건 앞에서부터 일부뿐이다. 수천 개를 한 번에 그리면
    // 스크롤이 감당이 안 되고, 어차피 필요한 건 가까운 몇 곳이다.
    const shown = filtered.slice(0, nearbyState.visibleCount);
    const countText =
      filtered.length > shown.length
        ? s.nearbyShowing(shown.length, filtered.length)
        : updated
          ? s.nearbyCountWithUpdated(filtered.length, updated)
          : s.nearbyCount(filtered.length);
    statusEl.textContent = countText;

    listEl.innerHTML = shown.length
      ? shown.map((item) => nearbyItemHtml(item, s)).join("")
      : `<p class="nearby-empty">${escapeHtml(s.nearbyEmpty)}</p>`;

    const moreButton = document.getElementById("nearby-more");
    const remaining = filtered.length - shown.length;
    moreButton.hidden = remaining <= 0;
    if (remaining > 0) {
      moreButton.textContent = s.nearbyMore(Math.min(remaining, NEARBY_PAGE_SIZE));
    }
  }

  /** 지금 지역의 목록에 실제로 존재하는 시·군·구만 고른다. */
  function renderSigunguOptions(items) {
    const select = document.getElementById("nearby-sigungu");
    const values = [...new Set(items.map(sigunguOf).filter(Boolean))].sort((a, b) =>
      a.localeCompare(b, "ko")
    );

    // 지역을 바꿨는데 이전 시군구가 남아 있으면 결과가 0건이 된다.
    if (nearbyState.sigungu && !values.includes(nearbyState.sigungu)) nearbyState.sigungu = "";

    const options = [
      `<option value="">${escapeHtml(STRINGS[locale].nearbyAllSigungu)}</option>`,
      ...values.map(
        (value) =>
          `<option value="${escapeHtml(value)}" ${
            value === nearbyState.sigungu ? "selected" : ""
          }>${escapeHtml(value)}</option>`
      ),
    ].join("");

    // 세종처럼 시군구가 없는 지역에서는 선택 자체를 감춘다.
    select.hidden = values.length === 0;
    document.getElementById("txt-nearby-sigungu-label").hidden = values.length === 0;
    select.innerHTML = options;
  }

  function renderNearbyRegionOptions() {
    const select = document.getElementById("nearby-region");
    const regions = nearbyMeta?.regions ?? [];
    select.innerHTML = regions
      .map(
        (region) =>
          `<option value="${region.code}" ${
            region.code === nearbyState.region ? "selected" : ""
          }>${escapeHtml(nearbyRegionLabel(region))}</option>`
      )
      .join("");
  }

  async function initNearby() {
    if (nearbyLoaded) return;
    nearbyLoaded = true;
    const s = STRINGS[locale];
    const statusEl = document.getElementById("nearby-status");
    statusEl.textContent = s.nearbyLoading;

    try {
      nearbyMeta = await loadNearbyJson("./data/medical-meta.json");
    } catch (err) {
      console.error("[nearby] meta", err.message);
      statusEl.textContent = s.nearbyError;
      nearbyLoaded = false; // 다음에 탭을 다시 열면 재시도
      return;
    }

    if (!nearbyMeta.regions?.some((r) => r.code === nearbyState.region)) {
      nearbyState.region = nearbyMeta.regions?.[0]?.code ?? "seoul";
    }
    renderNearbyRegionOptions();
    await renderNearby();
  }

  /** 조건이 바뀌면 늘려놓은 표시 개수를 처음으로 되돌린다. */
  function renderNearbyFromTop() {
    nearbyState.visibleCount = NEARBY_PAGE_SIZE;
    renderNearby();
  }

  document.getElementById("nearby-kind").addEventListener("change", (e) => {
    nearbyState.kind = e.target.value;
    // 약국과 응급실은 시군구 구성이 달라서 이전 선택을 유지하면 0건이 되기 쉽다.
    nearbyState.sigungu = "";
    renderNearbyFromTop();
  });

  document.getElementById("nearby-region").addEventListener("change", (e) => {
    nearbyState.region = e.target.value;
    nearbyState.sigungu = "";
    localStorage.setItem(NEARBY_REGION_KEY, nearbyState.region);
    renderNearbyFromTop();
  });

  document.getElementById("nearby-sigungu").addEventListener("change", (e) => {
    nearbyState.sigungu = e.target.value;
    renderNearbyFromTop();
  });

  document.getElementById("nearby-open-now").addEventListener("change", (e) => {
    nearbyState.openNow = e.target.checked;
    renderNearbyFromTop();
  });

  document.getElementById("nearby-search").addEventListener("input", (e) => {
    nearbyState.query = e.target.value;
    renderNearbyFromTop();
  });

  document.getElementById("nearby-more").addEventListener("click", () => {
    nearbyState.visibleCount += NEARBY_PAGE_SIZE;
    renderNearby();
  });

  document.getElementById("nearby-locate-btn").addEventListener("click", (e) => {
    const s = STRINGS[locale];
    const button = e.currentTarget;
    const statusEl = document.getElementById("nearby-status");

    // 이미 켜져 있으면 끈다(이름순으로 되돌림).
    if (nearbyState.coords) {
      nearbyState.coords = null;
      button.setAttribute("aria-pressed", "false");
      renderNearbyFromTop();
      return;
    }
    if (!navigator.geolocation) {
      statusEl.textContent = s.nearbyLocateUnsupported;
      return;
    }
    statusEl.textContent = s.nearbyLocating;
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        nearbyState.coords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        button.setAttribute("aria-pressed", "true");
        renderNearbyFromTop();
      },
      () => {
        statusEl.textContent = s.nearbyLocateDenied;
      },
      { timeout: 10000 }
    );
  });

  // ---- Language toggle ----
  document.getElementById("lang-toggle").addEventListener("click", () => {
    locale = locale === "en" ? "ko" : "en";
    localStorage.setItem(LOCALE_KEY, locale);
    applyStaticText();
    render();
    renderRegression();
    renderGrowth();
    // 지역명과 배지 문구가 언어를 타므로 이미 열어본 적 있으면 다시 그린다.
    if (nearbyLoaded && nearbyMeta) {
      renderNearbyRegionOptions();
      renderNearby();
    }
  });

  // ---- Print & share ----
  // Returns null when there's nothing to summarize yet (no checked items and
  // no regression flag), so callers can tell "no result" apart from "empty result".
  function composeResultSummaryText() {
    const s = t();
    const unlocked = unlockedKeySet();
    const answeredKeys = Object.keys(responses).filter((k) => unlocked.has(k));
    if (answeredKeys.length === 0 && regressionFlag !== "yes") return null;

    const lines = [s.shareTitle, ""];
    lines.push(document.getElementById("result-title").textContent);
    lines.push(document.getElementById("result-text").textContent);
    lines.push("");
    lines.push(s.shareNotYetLabel + ":");

    const notYetLines = [];
    DATA.forEach((band) => {
      if (isBandLocked(band)) return;
      band.items.forEach((item, idx) => {
        const key = itemKey(band.month, idx);
        if (responses[key] === "notyet") {
          notYetLines.push("- [" + band.label[locale] + " / " + DOMAIN_LABELS[locale][item.domain] + "] " + item[locale]);
        }
      });
    });
    lines.push(notYetLines.length ? notYetLines.join("\n") : s.shareNoneFlagged);

    return lines.join("\n");
  }

  document.getElementById("print-btn").addEventListener("click", () => {
    window.print();
  });

  // ---- Symptom urgency check ----
  // Deliberately NOT persisted to localStorage — this is a momentary,
  // situational check, not a longitudinal record like the checklist/growth log.
  // Sources: WHO IMCI chart booklet, AAP/HealthyChildren.org, NHS "when to worry"
  // guidance — see README for the specific thresholds and citations.
  const CATEGORY_TITLES = {
    cough: { ko: "기침·호흡곤란", en: "Cough / Breathing difficulty" },
    vomit: { ko: "구토·설사·탈수", en: "Vomiting / Diarrhea / Dehydration" },
    rash: { ko: "발진", en: "Rash" },
  };

  const FEVER_DANGER_SIGNS = [
    { ko: "목이 뻣뻣하거나, 대천문(정수리 숨구멍)이 부풀어 있어요", en: "Stiff neck, or a bulging soft spot on the head" },
    { ko: "경련(발작)을 했어요", en: "Had a seizure/convulsion" },
    { ko: "무기력하거나 깨워도 잘 안 일어나요", en: "Lethargic or hard to wake" },
    { ko: "숨쉬기 힘들어해요", en: "Struggling to breathe" },
    { ko: "잘 못 마시거나 안 먹으려 해요", en: "Barely drinking/eating or refusing to" },
    { ko: "피부에 눌러도 안 사라지는 자반/반점이 있어요", en: "A rash that doesn't fade when pressed" },
  ];

  const SYMPTOM_CATEGORIES = [
    {
      key: "cough",
      tier1: [
        { ko: "숨 쉴 때마다 끙끙거리는 소리가 나요", en: "Grunts with every breath" },
        { ko: "코가 벌렁거려요", en: "Nostrils flare with breathing" },
        { ko: "숨 쉴 때 갈비뼈 사이나 가슴 아래가 움푹 들어가요", en: "Skin sucks in between the ribs or below the chest with each breath" },
        { ko: "입술이나 얼굴이 파랗거나 창백해요", en: "Lips or face look blue or grey" },
        { ko: "가만히 있어도 쌕쌕거리거나 그렁거리는 소리가 들려요", en: "Makes a wheezing or harsh sound (stridor) even at rest" },

      ],

        { ko: "청진기 없이도 쌕쌕거리는 소리가 들려요", en: "Wheezing audible without a stethoscope" },
      ],
    },
    {
      key: "vomit",
      tier1: [
        { ko: "구토물이 초록색/담즙색이에요", en: "Vomit is green or bile-colored" },

  function computeFeverResult() {
    const s = t();
    const fs = symptomState.fever;
    const temp = parseFloat(fs.temp);
    const days = parseFloat(fs.days);
    const hasTemp = Number.isFinite(temp) && temp > 0;
    const anyDanger = Object.values(fs.danger).some(Boolean);
    const ageMonths = currentAgeMonthsFloat();

    if (!hasTemp && !anyDanger) return null;
    if (anyDanger) return { tier: 1, title: s.symptomTier1Title, text: s.symptomTier1Text };
    if (hasTemp && temp > 40.6) return { tier: 1, title: s.symptomTier1Title, text: s.symptomTier1Text };

    if (ageMonths === null) {
      if (hasTemp && temp >= 38.0) return { tier: 1, title: s.symptomTier1Title, text: s.symptomTier1Text };
    } else if (ageMonths < 3) {
      if (hasTemp && temp >= 38.0) return { tier: 1, title: s.symptomTier1Title, text: s.symptomTier1Text };
    } else if (ageMonths < 6) {
      if (hasTemp && temp >= 38.3) return { tier: 2, title: s.symptomTier2Title, text: s.symptomTier2Text };
    } else {
      if (hasTemp && temp >= 39.4) return { tier: 2, title: s.symptomTier2Title, text: s.symptomTier2Text };
    }

    if (hasTemp && Number.isFinite(days) && days >= 5) {
      return { tier: 3, title: s.symptomFeverTier3Title, text: s.symptomFeverTier3Text };
    }
    if (hasTemp) return { tier: 4, title: s.symptomTier4Title, text: s.symptomFeverTier4Text };
    return null;
  }

  function computeCategoryResult(cat) {
    const s = t();
    const st = symptomState[cat.key];
    const anyTier1 = cat.tier1.some((_, idx) => st.tier1[idx]);
    const anyTier2 = cat.tier2.some((_, idx) => st.tier2[idx]);
    if (anyTier1) return { tier: 1, title: s.symptomTier1Title, text: s.symptomTier1Text };
    if (anyTier2) return { tier: 2, title: s.symptomTier2Title, text: s.symptomTier2Text };
    return { tier: 4, title: s.symptomTier4Title, text: s.symptomTier4Text };

  // ---- Fever reducer dose calculator ----
  // Reference ranges only (mg), never converted to mL — product concentrations vary
  // and guessing one would be a real error risk. Hard age gates fail closed: if age
  // is unknown, no dose is shown at all, rather than guessing a "probably fine" default.
  // Sources: AAP/HealthyChildren.org, FDA pediatric labeling, Korea's MFDS — cross-checked.
  const DRUGS = {
    acetaminophen: { mgPerKgMin: 10, mgPerKgMax: 15, interval: "4~6", maxPerDay: 5, minAgeMonths: 3 },
    ibuprofen: { mgPerKgMin: 5, mgPerKgMax: 10, interval: "6~8", maxPerDay: 4, minAgeMonths: 6 },
  };

  const doseState = { weight: "", drug: "acetaminophen" };

  function latestGrowthWeight() {
    const withWeight = growthEntries.filter((e) => e.weight != null);
    if (withWeight.length === 0) return null;
    return withWeight[withWeight.length - 1].weight;
  }

  function computeDose() {
    const weight = parseFloat(doseState.weight);
    if (!Number.isFinite(weight) || weight <= 0) return { state: "need-weight" };

    const ageMonths = currentAgeMonthsFloat();
    if (ageMonths === null) return { state: "need-birthdate" };
    if (ageMonths < 3) return { state: "blocked-under3mo" };

    const drug = DRUGS[doseState.drug];
    if (doseState.drug === "ibuprofen" && ageMonths < drug.minAgeMonths) {
      return { state: "blocked-ibuprofen-under6mo" };
    }

    const doseMin = Math.round(weight * drug.mgPerKgMin);
    const doseMax = Math.round(weight * drug.mgPerKgMax);
    let dailyCap;
    if (doseState.drug === "acetaminophen") {
      const capPerKg = ageMonths < 24 ? 60 : 75;
      dailyCap = Math.min(Math.round(weight * capPerKg), 4000);
    } else {
      dailyCap = doseMax * drug.maxPerDay;
    }

    return { state: "ok", doseMin, doseMax, interval: drug.interval, maxPerDay: drug.maxPerDay, dailyCap };
  }

  function renderDoseResult() {
    const s = t();
    const result = computeDose();
    if (result.state === "need-weight") {
      return '<div class="symptom-result"><span class="symptom-result-tier">' + s.careNeedWeight + "</span></div>";
    }
    if (result.state === "need-birthdate") {
      return '<div class="symptom-result tier2"><span class="symptom-result-tier">' + s.careNeedBirthdate + "</span></div>";
    }
    if (result.state === "blocked-under3mo") {
      return '<div class="symptom-result tier1"><span class="symptom-result-tier">' + s.careBlockedUnder3mo + "</span></div>";
    }
    if (result.state === "blocked-ibuprofen-under6mo") {
      return '<div class="symptom-result tier1"><span class="symptom-result-tier">' + s.careBlockedIbuprofenUnder6mo + "</span></div>";
    }
    return (
      '<div class="symptom-result tier4">' +
      '<div class="symptom-result-title">' + s.careDoseResult(result.doseMin, result.doseMax) + "</div>" +
      '<div class="symptom-result-text">' +
      s.careIntervalResult(result.interval) +
      "<br>" +
      s.careMaxPerDayResult(result.maxPerDay, result.dailyCap) +
      "</div>" +
      "</div>"
    );
  }

  const GROWTH_REF = {};
  GROWTH_REF_CSV.trim().split("\n").forEach((line) => {
    const [standard, measure, sex, months, L, M, S] = line.split(",");
    const key = standard + "-" + measure + "-" + sex;
    if (!GROWTH_REF[key]) GROWTH_REF[key] = [];
    GROWTH_REF[key].push({ months: parseFloat(months), L: parseFloat(L), M: parseFloat(M), S: parseFloat(S) });
  });
  Object.values(GROWTH_REF).forEach((rows) => rows.sort((a, b) => a.months - b.months));

  // measureKind: "weight" always; "height" maps to WHO "length" under 24mo, CDC "stature" from 24mo.
  function lookupLMS(ageMonths, measureKind, sex) {
    const standard = ageMonths < 24 ? "who" : "cdc";
    const measure = measureKind === "height" ? (standard === "who" ? "length" : "stature") : "weight";
    const rows = GROWTH_REF[standard + "-" + measure + "-" + sex];
    if (!rows || rows.length === 0) return null;
    if (ageMonths < rows[0].months || ageMonths > rows[rows.length - 1].months) return null;

    let lo = rows[0], hi = rows[rows.length - 1];
    for (let i = 0; i < rows.length - 1; i++) {
      if (ageMonths >= rows[i].months && ageMonths <= rows[i + 1].months) {
        lo = rows[i];
        hi = rows[i + 1];
        break;
      }
    }
    if (lo === hi || hi.months === lo.months) return lo;
    const frac = (ageMonths - lo.months) / (hi.months - lo.months);
    return {
      L: lo.L + (hi.L - lo.L) * frac,
      M: lo.M + (hi.M - lo.M) * frac,
      S: lo.S + (hi.S - lo.S) * frac,
    };
  }

  // Standard normal CDF via the Abramowitz-Stegun erf approximation (~1e-7 accuracy).
  function normalCDF(z) {
    const t = 1 / (1 + 0.2316419 * Math.abs(z));
    const d = 0.3989423 * Math.exp((-z * z) / 2);
    let p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
    if (z > 0) p = 1 - p;
    return p;
  }

  // Returns { z, percentile } or null if out of the supported age range (0-36.5mo)
  // or the reference data for that sex isn't available.
  function calcPercentile(value, ageMonths, measureKind, sex) {
    if (!Number.isFinite(value) || value <= 0 || !sex) return null;
    const lms = lookupLMS(ageMonths, measureKind, sex);
    if (!lms) return null;
    const { L, M, S } = lms;
    const z = Math.abs(L) < 1e-9 ? Math.log(value / M) / S : (Math.pow(value / M, L) - 1) / (L * S);
    return { z, percentile: normalCDF(z) * 100 };
  }

  // ---- Growth log ----
  const GROWTH_KEY = "dev-growth-log-v1";
  let growthEntries = [];
  try {
    growthEntries = JSON.parse(localStorage.getItem(GROWTH_KEY)) || [];
  } catch (e) {
    growthEntries = [];
  }

  function saveGrowth() {
    localStorage.setItem(GROWTH_KEY, JSON.stringify(growthEntries));
  }

  function formatPercentileValue(result) {
    const flag = Math.abs(result.z) > 5 ? " " + t().percentileImplausible : "";
    return Math.round(result.percentile) + "%" + flag;
  }

  function formatPercentileCell(entry) {
    const s = t();
    if (!childBirthdate) return s.percentileNoData;
    if (!childSex) return s.percentileNeedSex;
    const ageAt = ageMonthsFloatAt(entry.date);
    if (ageAt === null) return s.percentileNoData;

    const heightResult = entry.height != null ? calcPercentile(entry.height, ageAt, "height", childSex) : null;
    const weightResult = entry.weight != null ? calcPercentile(entry.weight, ageAt, "weight", childSex) : null;
    const hText = entry.height == null ? s.percentileNoData : heightResult ? formatPercentileValue(heightResult) : s.percentileOutOfRange;
    const wText = entry.weight == null ? s.percentileNoData : weightResult ? formatPercentileValue(weightResult) : s.percentileOutOfRange;
    return s.percentileCell(hText, wText);
  }

  function renderGrowth() {
    const s = t();
    growthEntries.sort((a, b) => a.date.localeCompare(b.date));

    const tbody = document.getElementById("growth-table-body");
    const table = document.getElementById("growth-table");
    const empty = document.getElementById("growth-empty");
    document.getElementById("growth-note2").textContent = s.growthNote2;
    tbody.innerHTML = "";

    if (growthEntries.length === 0) {
      table.style.display = "none";
      empty.style.display = "block";
      empty.textContent = s.growthEmpty;
    } else {
      table.style.display = "table";
      empty.style.display = "none";
      growthEntries.forEach((entry) => {
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + entry.date + "</td>" +
          "<td>" + (entry.height != null ? entry.height : "–") + "</td>" +
          "<td>" + (entry.weight != null ? entry.weight : "–") + "</td>" +
          "<td>" + formatPercentileCell(entry) + "</td>" +
          '<td class="del"><button type="button" data-id="' + entry.id + '" aria-label="' + s.deleteEntryAria(entry.date) + '">' + s.delBtn + "</button></td>";
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll("button[data-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          growthEntries = growthEntries.filter((e) => String(e.id) !== btn.dataset.id);
          saveGrowth();
          renderGrowth();
        });
      });
    }

    drawChart("chart-height", growthEntries.filter((e) => e.height != null).map((e) => ({ date: e.date, value: e.height })));
    drawChart("chart-weight", growthEntries.filter((e) => e.weight != null).map((e) => ({ date: e.date, value: e.weight })));
  }

  function drawChart(canvasId, points) {
    const canvas = document.getElementById(canvasId);
    const emptyEl = document.getElementById(canvasId + "-empty");
    const ctx = canvas.getContext("2d");
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = rect.width || 560;
    const h = 140;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (points.length < 2) {
      canvas.style.display = "none";
      emptyEl.style.display = "block";
      return;
    }
    canvas.style.display = "block";
    emptyEl.style.display = "none";

    const pad = { top: 10, right: 10, bottom: 10, left: 34 };
    const plotW = w - pad.left - pad.right;
    const plotH = h - pad.top - pad.bottom;

    const values = points.map((p) => p.value);
    let min = Math.min(...values);
    let max = Math.max(...values);
    if (min === max) { min -= 1; max += 1; }
    const margin = (max - min) * 0.15;
    min -= margin;
    max += margin;

    const styles = getComputedStyle(document.documentElement);
    const line = styles.getPropertyValue("--line").trim();
    const sage = styles.getPropertyValue("--sage").trim();
    const amber = styles.getPropertyValue("--amber").trim();
    const inkFaint = styles.getPropertyValue("--ink-faint").trim();

    ctx.strokeStyle = line;
    ctx.lineWidth = 1;
    ctx.font = "10px " + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = inkFaint;
    for (let i = 0; i <= 3; i++) {
      const y = pad.top + (plotH / 3) * i;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(w - pad.right, y);
      ctx.stroke();
      const val = max - ((max - min) / 3) * i;
      ctx.fillText(val.toFixed(1), 2, y + 3);
    }

    const xFor = (i) => pad.left + (points.length === 1 ? 0 : (plotW / (points.length - 1)) * i);
    const yFor = (v) => pad.top + plotH - ((v - min) / (max - min)) * plotH;

    ctx.beginPath();
    points.forEach((p, i) => {
      const x = xFor(i);
      const y = yFor(p.value);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.lineTo(xFor(points.length - 1), pad.top + plotH);
    ctx.lineTo(xFor(0), pad.top + plotH);
    ctx.closePath();
    ctx.fillStyle = sage + "22";
    ctx.fill();

    ctx.beginPath();
    points.forEach((p, i) => {
      const x = xFor(i);
      const y = yFor(p.value);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = sage;
    ctx.lineWidth = 2;
    ctx.stroke();

    points.forEach((p, i) => {
      const x = xFor(i);
      const y = yFor(p.value);
      const isLast = i === points.length - 1;
      ctx.beginPath();
      ctx.arc(x, y, isLast ? 4 : 2.5, 0, Math.PI * 2);
      ctx.fillStyle = isLast ? amber : sage;
      ctx.fill();
    });
  }

  document.getElementById("growth-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const date = document.getElementById("g-date").value;
    const heightVal = document.getElementById("g-height").value;
    const weightVal = document.getElementById("g-weight").value;
    if (!date || (!heightVal && !weightVal)) return;

    growthEntries.push({
      id: date + "-" + Math.random().toString(36).slice(2, 8),
      date,
      height: heightVal ? parseFloat(heightVal) : null,
      weight: weightVal ? parseFloat(weightVal) : null,
    });
    saveGrowth();
    e.target.reset();
    renderGrowth();
    renderCareCards();
  });

  document.getElementById("reset-growth-btn").addEventListener("click", () => {
    if (confirm(t().resetGrowthConfirm)) {
      growthEntries = [];
      localStorage.removeItem(GROWTH_KEY);
      renderGrowth();
      renderCareCards();
    }
  });

  applyStaticText();
  render();
  renderRegression();
  renderGrowth();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
